<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%E2%9B%B5%3C/text%3E%3C/svg%3E">
  <title>分數航海任務｜單位分數評量過關遊戲</title>
  <style>
    :root{--sea:#123f58;--deep:#092b41;--paper:#fffaf0;--ink:#173348;--coral:#e66850;--gold:#f3bc45;--mint:#c8e9db;--line:#b9d0d4;--bad:#b14642}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(#bce3e6 0 240px,#eaf3ee 240px);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.55}
    button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:4px solid #ffad35;outline-offset:3px}a{color:inherit}
    .shell{width:min(100% - 28px,1000px);margin:0 auto;padding:22px 0 56px}.mast{background:var(--deep);color:white;border:4px solid var(--deep);border-radius:28px 28px 8px 8px;padding:22px 30px;position:relative;overflow:hidden}.mast:after{content:"〰 〰 〰";position:absolute;right:26px;bottom:-16px;color:#79c6cf;font-size:78px;letter-spacing:-8px;opacity:.45;pointer-events:none}.eyebrow{font-weight:900;letter-spacing:.13em;color:#8ddcdd;font-size:.82rem}.mast h1{font-size:clamp(2rem,5vw,3.3rem);line-height:1.18;margin:8px 0 10px;letter-spacing:.04em}.mast p{margin:0;max-width:620px;font-size:1.08rem}.badge{display:inline-block;border:2px solid var(--gold);color:#ffe6a6;border-radius:999px;padding:3px 12px;margin-top:15px;font-weight:800;font-size:.86rem}
    .card{background:var(--paper);border:3px solid var(--sea);border-radius:8px 8px 25px 25px;box-shadow:8px 9px 0 #9abdc0;padding:clamp(18px,4vw,34px);margin-top:18px}.hidden{display:none!important}.intro-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:23px 0}.intro-tile{background:#e8f4f0;border:2px solid var(--line);padding:17px;border-radius:15px}.intro-tile strong{display:block;color:var(--sea);font-size:1.08rem}.field{display:block;font-weight:800;margin:19px 0 7px}.field input{width:min(100%,310px);padding:11px 13px;border:2px solid var(--sea);border-radius:10px;background:#fff}.small{font-size:.91rem;color:#476277}.primary,.secondary{border:0;border-radius:12px;padding:12px 22px;font-weight:900;min-height:48px}.primary{background:var(--coral);color:white;box-shadow:0 5px 0 #a43b2e}.primary:hover{transform:translateY(2px);box-shadow:0 3px 0 #a43b2e}.secondary{background:#d8eae9;color:var(--deep);border:2px solid var(--sea)}.secondary:hover{background:#c3e1df}.button-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:23px}
    .map{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 20px}.map-step{border:2px solid var(--line);border-radius:15px;padding:10px;background:#eff6f3;text-align:center;font-weight:900;font-size:.9rem}.map-step.active{background:var(--gold);border-color:var(--sea)}.map-step.done{background:var(--mint);border-color:#558f85}.map-step span{display:block;font-size:1.35rem}.question-top{display:flex;justify-content:space-between;gap:15px;align-items:center;color:#4a6675;font-weight:800}.progress{height:13px;background:#d9e9e7;border-radius:999px;overflow:hidden;margin:9px 0 25px}.progress>div{height:100%;background:var(--coral);transition:width .3s}.scene-label{display:inline-block;color:var(--sea);font-weight:900;border-bottom:4px solid var(--gold);margin-bottom:8px}.question h2{font-size:clamp(1.36rem,3vw,2rem);line-height:1.35;margin:3px 0 8px}.story{margin:0 0 18px;color:#476277}.visual{background:#eaf3ef;border:2px dashed #8cafb0;border-radius:18px;padding:18px;margin:16px 0 22px;min-height:135px;display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap}.visual svg{max-width:100%;height:auto}.visual-caption{text-align:center;font-weight:800;margin-top:8px}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.choice{width:100%;min-height:65px;background:white;border:3px solid #a8c1c5;border-radius:13px;padding:10px;font-weight:800;color:var(--ink);text-align:center;transition:transform .12s,background .12s}.choice:hover{transform:translateY(-2px);border-color:var(--sea)}.choice.selected{background:#ffebae;border-color:var(--coral);box-shadow:0 3px 0 var(--coral)}.reason-title{font-weight:900;font-size:1.12rem;margin:23px 0 10px}.reason-grid{display:grid;grid-template-columns:1fr;gap:10px}.reason-grid .choice{text-align:left;min-height:52px}.slider-wrap{width:min(100%,460px);text-align:center}.fold-paper{height:150px;background:linear-gradient(140deg,#fff5b2,#f0c971);border:4px solid #ad7441;position:relative;border-radius:4px;box-shadow:7px 7px 0 #c6d6c6}.fold-line{position:absolute;top:0;bottom:0;border-left:5px dashed var(--coral);transition:left .1s}.fold-paper:before{content:"左邊";position:absolute;left:15%;top:38%;font-weight:900;color:#725127}.fold-paper:after{content:"右邊";position:absolute;right:15%;top:38%;font-weight:900;color:#725127}.slider-wrap input{width:100%;margin-top:17px;accent-color:var(--coral)}.slider-read{font-weight:900}.status{min-height:28px;color:var(--bad);font-weight:800;margin-top:8px}.bar-compare{display:grid;gap:18px;width:min(100%,520px)}.bar-row{display:grid;grid-template-columns:100px 1fr;gap:12px;align-items:center;font-weight:900}.bar-track{height:48px;display:grid;border:3px solid var(--sea);background:white}.bar-track span{border-right:2px solid var(--sea)}.bar-track span:last-child{border-right:0}.bar-track span:first-child{background:var(--gold)}.pizza-svg{width:170px;height:170px}.pizza-note{text-align:center;font-weight:900}.ticket{display:inline-block;background:var(--gold);color:var(--deep);padding:3px 10px;border-radius:5px;font-weight:900;transform:rotate(-3deg)}
    .result-head{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}.score-circle{width:112px;height:112px;border-radius:50%;background:var(--sea);color:white;display:grid;place-content:center;text-align:center;border:7px solid var(--gold);font-size:1.7rem;font-weight:900;line-height:1.1}.score-circle small{font-size:.75rem}.result-head h2{font-size:clamp(1.5rem,4vw,2.4rem);margin:0 0 5px}.skill-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0}.skill{border:2px solid var(--line);border-radius:12px;padding:12px;background:#f2f8f3}.skill strong{display:block}.skill.low{border-color:#df9b81;background:#fff2e8}.review{border-top:2px solid var(--line);padding:15px 0}.review h3{margin:0 0 5px;font-size:1rem}.review p{margin:4px 0}.mark{font-weight:900;color:#2f7965}.mark.wrong{color:var(--bad)}.meta{color:#526978;font-size:.93rem}.footer{text-align:center;padding:28px 0 0;color:#476277;font-size:.9rem}.footer a{text-decoration:underline}.ship{font-size:4rem;line-height:1;text-align:center;margin:8px 0;filter:drop-shadow(4px 5px 0 #8cb9bf)}
    @media(max-width:650px){.intro-grid,.skill-list{grid-template-columns:1fr}.map{grid-template-columns:repeat(2,1fr)}.choice-grid{grid-template-columns:1fr}.result-head{grid-template-columns:1fr}.mast{padding:22px}.mast:after{display:none}.bar-row{grid-template-columns:72px 1fr}.visual{padding:12px}}
    @media print{body{background:white}.mast,.intro,.game,.button-row,.footer{display:none!important}.shell{width:100%;padding:0}.card{box-shadow:none;border:0;padding:0;margin:0}.result{display:block!important}.review{break-inside:avoid}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="mast"><div class="eyebrow">9-1 × 9-2 × 9-3　總結性評量</div><h1>分數航海任務</h1><p>帶著「平分、幾分之一、比較大小」三把鑰匙，幫探險船找到回家的航線。</p><span class="badge">8 個任務・每題要說出理由</span></header>
    <section class="card intro" id="intro"><div class="ship" aria-hidden="true">⛵</div><h2>準備上船！</h2><p>每一站先做決定，再選理由。全部完成後才會看到答案、分項成績與可以再練的觀念。</p><div class="intro-grid"><div class="intro-tile"><strong>怎麼過關？</strong>16 分中達 12 分，且四個航區各至少 2 分。</div><div class="intro-tile"><strong>怎麼計分？</strong>每題的「答案」和「理由」各 1 分；以第一次送出為準。</div></div><label class="field" for="player">座號或暱稱（選填）</label><input id="player" maxlength="20" autocomplete="off" placeholder="例如：12 號"><p class="small">紀錄只留在這台裝置的瀏覽器。老師可請學生列印或截圖結果頁。</p><button type="button" class="primary" id="start">開始航海</button></section>
    <section class="card game hidden" id="game" aria-live="polite"><nav class="map" id="map" aria-label="航海進度"></nav><div class="question-top"><span id="location"></span><span id="count"></span></div><div class="progress" aria-hidden="true"><div id="progressBar"></div></div><article class="question"><span class="scene-label" id="sceneLabel"></span><h2 id="questionTitle"></h2><p class="story" id="story"></p><div class="visual" id="visual"></div><div id="answerArea"></div><h3 class="reason-title">你為什麼這樣想？</h3><div class="reason-grid" id="reasonArea"></div><div class="status" id="status" role="status"></div><div class="button-row"><button type="button" class="primary" id="submit">送出這一站</button></div></article></section>
    <section class="card result hidden" id="result" aria-live="polite"><div class="result-head"><div class="score-circle"><span id="score"></span><small>／16 分</small></div><div><span class="ticket">航海紀錄</span><h2 id="resultTitle"></h2><p id="resultSummary"></p><p class="meta" id="resultMeta"></p></div></div><div class="skill-list" id="skills"></div><h2>每一站的航海筆記</h2><div id="reviews"></div><div class="button-row"><button type="button" class="primary" id="retry">再挑戰一次</button><button type="button" class="secondary" id="print">列印／存成 PDF</button></div></section>
    <div class="footer">原本的 <a href="unit-fraction-learning-island.html">單位分數冒險島</a> 仍可繼續練習。</div>
  </main>
  <script>
    const stages=[{name:"公平海灣",icon:"✂️"},{name:"分數披薩港",icon:"🍕"},{name:"長條比較海",icon:"📏"},{name:"生活任務島",icon:"🏝️"}];
    const svgPaper=(cuts,chosen=false)=>`<svg viewBox="0 0 160 110" role="img" aria-label="一張有分割線的長方形色紙" width="145"><rect x="5" y="5" width="150" height="100" rx="4" fill="#f6d781" stroke="#78532b" stroke-width="4"/>${cuts.map(x=>`<path d="M${x} 5V105" stroke="#78532b" stroke-width="3"/>`).join("")}${chosen?'<path d="M5 5H80V105H5Z" fill="#e66850" opacity=".28"/>':''}</svg>`;
    const pizza=(parts)=>{let s='<svg class="pizza-svg" viewBox="0 0 200 200" role="img" aria-label="一個披薩平均分成'+parts+'片，黃色是一片">';for(let i=0;i<parts;i++){const a=-Math.PI/2+i*2*Math.PI/parts,b=-Math.PI/2+(i+1)*2*Math.PI/parts;const x1=100+85*Math.cos(a),y1=100+85*Math.sin(a),x2=100+85*Math.cos(b),y2=100+85*Math.sin(b);s+=`<path d="M100 100L${x1} ${y1}A85 85 0 0 1 ${x2} ${y2}Z" fill="${i===0?'#f3bc45':'#f5a971'}" stroke="#9c5939" stroke-width="3"/>`}return s+'</svg>'};
    const bar=(parts,width=420)=>`<div class="bar-track" style="grid-template-columns:repeat(${parts},1fr);width:${typeof width==='number'?`min(100%,${width}px)`:width}">${Array.from({length:parts},()=>'<span></span>').join('')}</div>`;
    const shuffle=items=>{const out=[...items];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out};
    const choices=(options)=>shuffle(options.map((o,i)=>({text:o,index:i}))).map(o=>`<button type="button" class="choice" data-choice="${o.index}" aria-pressed="false">${o.text}</button>`).join("");
    const missions=[
      {stage:0,title:"哪張色紙可以公平分給兩個人？",story:"船員要把同一張長方形色紙分給兩人，每人拿一份。",visual:`<div class="pizza-note">A${svgPaper([50])}</div><div class="pizza-note">B${svgPaper([80])}</div><div class="pizza-note">C${svgPaper([40,90])}</div>`,answers:["A","B","C"],correct:1,reasons:["每份一樣大，才叫平分。","只要有切線，就叫平分。","份數越多，每份一定越大。"],reason:0,explain:"B 的兩份一樣大。判斷平分要看每一份的大小。"},
      {stage:0,title:"把歪掉的摺線救回來",story:"拖動摺線，讓左右兩邊一樣大。以 10% 為一格調整。",visual:'slider',answers:[],correct:50,reasons:["左右都占整張的一半。","左邊越小越公平。","切開後有兩份就算平分。"],reason:0,explain:"摺線在正中間（50%），左右各占整張的一半。"},
      {stage:1,title:"一片披薩，該怎麼說？",story:"這是 1 個完整披薩，平均切成 6 片，黃色是其中 1 片。",visual:`<div>${pizza(6)}<div class="visual-caption">完整的 1 個披薩</div></div>`,answers:["1/6 個披薩","1/6 片披薩","6/1 個披薩"],correct:0,reasons:["1 個披薩平分成 6 份，拿其中 1 份。","只要拿 1 片，就是 1/1 個披薩。","分母記拿到的片數。"],reason:0,explain:"以 1 個披薩為整體，平分 6 份取 1 份，是 1/6 個披薩，也可以說 1 片。"},
      {stage:1,title:"黃色是哪個分數？",story:"長條是完整的 1 條，平均分成 8 格，只塗黃其中 1 格。",visual:`<div style="width:min(100%,540px)">${bar(8,540)}<div class="visual-caption">完整的 1 條</div></div>`,answers:["1/8 條","1/7 條","8/1 條"],correct:0,reasons:["分母看完整長條平分的總份數。","分母看沒有塗色的格數。","分子看總共有幾格。"],reason:0,explain:"整條平分成 8 格，黃色 1 格，所以是 1/8 條。"},
      {stage:2,title:"同樣長的緞帶，哪一份比較大？",story:"兩條緞帶原本一樣長。黃色各是其中 1 份。",visual:`<div class="bar-compare"><div class="bar-row"><span>A　1/3</span>${bar(3)}</div><div class="bar-row"><span>B　1/6</span>${bar(6)}</div></div>`,answers:["A：1/3","B：1/6","一樣大"],correct:0,reasons:["同樣長的整條，平分越少份，每一份越大。","6 比 3 大，所以 1/6 較大。","顏色相同，大小就相同。"],reason:0,explain:"兩條一樣長，切成 3 份的每一份，比切成 6 份的每一份大。"},
      {stage:2,title:"整條不同長，還能只看分母嗎？",story:"A 是短緞帶的 1/2；B 是長緞帶的 1/4。看看黃色部分的實際長度。",visual:`<div class="bar-compare"><div class="bar-row"><span>A　1/2</span>${bar(2,'50%')}</div><div class="bar-row"><span>B　1/4</span>${bar(4,'100%')}</div></div>`,answers:["兩段黃色一樣長","A 的黃色比較長","B 的黃色比較長"],correct:0,reasons:["整條大小不同，先看實際長度，不能只用分母比。","1/2 一定比 1/4 長，不用看整條。","分母 4 比 2 大，所以 B 較長。"],reason:0,explain:"短條的 1/2 與兩倍長的長條的 1/4，都長 1 小段。比較分數時要先確認整體是否相同。"},
      {stage:3,title:"幫 24 位同學訂披薩",story:"每人拿 1 片，每個披薩都平均切成 4 片，而且剛好分完。要訂幾個披薩？",visual:`<div>${pizza(4)}<div class="visual-caption">1 個披薩＝4 片</div></div><div class="pizza-note">👧👦 × 24</div>`,answers:["6 個","4 個","24 個"],correct:0,reasons:["6 個披薩共有 6×4＝24 片。","1 個披薩就可以給 24 人。","只看人數，不用看每個披薩切幾片。"],reason:0,explain:"每個 4 片，6 個共有 24 片；每人 1 片，正好分完。每個披薩都要平分。"},
      {stage:3,title:"誰拿到比較大的一片？",story:"小安和小美拿到一樣大的披薩。小安的切成 4 等份，小美的切成 8 等份，每人都只拿 1 片。",visual:`<div><div class="pizza-note">小安</div>${pizza(4)}</div><div><div class="pizza-note">小美</div>${pizza(8)}</div>`,answers:["小安：1/4 個","小美：1/8 個","兩人一樣大"],correct:0,reasons:["整體一樣大，平分越少份，每一份越大。","8 比 4 大，所以 1/8 比較大。","兩人都拿 1 片，所以一定一樣大。"],reason:0,explain:"兩個披薩一樣大，切 4 份的 1 片比切 8 份的 1 片大。"}
    ];
    let index=0,answer=null,reason=null,fold=30,records=[],player="";
    const el=id=>document.getElementById(id);
    const escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function setScreen(name){for(const id of ['intro','game','result'])el(id).classList.toggle('hidden',id!==name);window.scrollTo({top:0,behavior:'instant'})}
    function render(){const q=missions[index],stage=stages[q.stage];answer=null;reason=null;fold=30;el('map').innerHTML=stages.map((s,i)=>`<div class="map-step ${i<q.stage?'done':i===q.stage?'active':''}"><span aria-hidden="true">${s.icon}</span>${s.name}</div>`).join('');el('location').textContent=stage.name;el('count').textContent=`第 ${index+1} / ${missions.length} 站`;el('progressBar').style.width=`${index/missions.length*100}%`;el('sceneLabel').textContent=`任務 ${index+1} · ${stage.name}`;el('questionTitle').textContent=q.title;el('story').textContent=q.story;el('visual').innerHTML=q.visual==='slider'?`<div class="slider-wrap"><div class="fold-paper"><div class="fold-line" id="foldLine" style="left:30%"></div></div><input type="range" id="foldRange" min="10" max="90" step="10" value="30" aria-label="摺線位置"><div class="slider-read" id="foldRead">摺線在 30% 的位置</div></div>`:q.visual;el('answerArea').innerHTML=q.visual==='slider'?'<p class="small">移動摺線後，再選理由。</p>':`<div class="choice-grid" role="group" aria-label="你的答案">${choices(q.answers)}</div>`;el('reasonArea').innerHTML=choices(q.reasons);el('status').textContent='';if(q.visual==='slider'){el('foldRange').addEventListener('input',e=>{fold=Number(e.target.value);el('foldLine').style.left=fold+'%';el('foldRead').textContent=`摺線在 ${fold}% 的位置`})}else{el('answerArea').querySelectorAll('.choice').forEach(btn=>btn.addEventListener('click',()=>select('answerArea',btn,v=>answer=v)))}el('reasonArea').querySelectorAll('.choice').forEach(btn=>btn.addEventListener('click',()=>select('reasonArea',btn,v=>reason=v)))}
    function select(area,btn,save){const value=Number(btn.dataset.choice);save(value);el(area).querySelectorAll('.choice').forEach(b=>{const on=b===btn;b.classList.toggle('selected',on);b.setAttribute('aria-pressed',String(on))});el('status').textContent=''}
    function submit(){const q=missions[index];if((q.visual!=='slider'&&answer===null)||reason===null){el('status').textContent='請先完成答案和理由，再送出。';return}const actual=q.visual==='slider'?fold:answer;records.push({title:q.title,stage:q.stage,answerCorrect:actual===q.correct,reasonCorrect:reason===q.reason,chosen:q.visual==='slider'?`${fold}%`:q.answers[actual],chosenReason:q.reasons[reason],explain:q.explain});index++;if(index<missions.length){render()}else{finish()}}
    function finish(){const score=records.reduce((n,r)=>n+Number(r.answerCorrect)+Number(r.reasonCorrect),0),stageScores=stages.map((_,i)=>records.filter(r=>r.stage===i).reduce((n,r)=>n+Number(r.answerCorrect)+Number(r.reasonCorrect),0)),passed=score>=12&&stageScores.every(n=>n>=2),when=new Date();const result={player,score,stageScores,passed,when:when.toISOString(),records};try{const old=JSON.parse(localStorage.getItem('fractionFinalQuestAttempts')||'[]');old.unshift(result);localStorage.setItem('fractionFinalQuestAttempts',JSON.stringify(old.slice(0,10)))}catch{}el('score').textContent=score;el('resultTitle').textContent=passed?'航線找到了，闖關成功！':'再整理觀念，就能抵達！';el('resultSummary').textContent=passed?'你能把平分、幾分之一和比較大小用在新情境。看看下方有沒有想再練的一站。':'先看下方哪個航區需要補強，再回到原本的遊戲操作，接著重新挑戰。';el('resultMeta').textContent=`${player?player+'｜':''}${when.toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})}｜答案與理由各 1 分`;el('skills').innerHTML=stages.map((s,i)=>`<div class="skill ${stageScores[i]<2?'low':''}"><strong>${s.icon} ${s.name}　${stageScores[i]} / 4</strong>${stageScores[i]<2?'建議回到原關卡操作，再說一次理由。':'這個航區達到過關標準。'}</div>`).join('');el('reviews').innerHTML=records.map((r,i)=>`<div class="review"><h3>${i+1}. ${escapeText(r.title)}</h3><p><span class="mark ${r.answerCorrect?'':'wrong'}">答案${r.answerCorrect?'✓':'✗'}</span>：${escapeText(r.chosen)}</p><p><span class="mark ${r.reasonCorrect?'':'wrong'}">理由${r.reasonCorrect?'✓':'✗'}</span>：${escapeText(r.chosenReason)}</p><p class="meta">想一想：${escapeText(r.explain)}</p></div>`).join('');setScreen('result')}
    function restart(){index=0;answer=null;reason=null;fold=30;records=[];setScreen('intro')}
    el('start').addEventListener('click',()=>{player=el('player').value.trim();index=0;records=[];setScreen('game');render()});el('submit').addEventListener('click',submit);el('retry').addEventListener('click',restart);el('print').addEventListener('click',()=>window.print());
  </script>
</body>
