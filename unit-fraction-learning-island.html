<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>單位分數冒險島</title>
  <style>
    :root {
      --ink: #243043;
      --blue: #2387d6;
      --green: #64b847;
      --orange: #f28a24;
      --shadow: 0 22px 48px rgba(28, 70, 110, .22);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
      background:
        radial-gradient(circle at 16% 10%, rgba(255, 239, 119, .7), transparent 18rem),
        radial-gradient(circle at 86% 12%, rgba(255, 143, 165, .38), transparent 18rem),
        linear-gradient(180deg, #9be7ff 0%, #e9fbff 42%, #fff7d8 100%);
    }

    .page {
      width: min(1260px, calc(100% - 24px));
      margin: 0 auto;
      padding: 18px 0 34px;
    }

    .cover {
      position: relative;
      border: 8px solid #fff;
      border-radius: 34px;
      overflow: hidden;
      box-shadow: var(--shadow), 0 0 0 6px rgba(255, 204, 76, .95);
      background: #bfefff;
    }

    .cover-image {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
    }

    .mission {
      position: absolute;
      display: block;
      border-radius: 28px;
      text-decoration: none;
      outline: 0;
      transition: transform .16s ease, box-shadow .16s ease;
    }

    .mission:hover,
    .mission:focus-visible {
      transform: translateY(-6px);
      box-shadow: 0 0 0 7px rgba(255, 255, 255, .9), 0 0 0 13px rgba(255, 214, 75, .95);
    }

    .mission-1 {
      left: 2.3%;
      top: 60.6%;
      width: 31.3%;
      height: 37%;
    }

    .mission-2 {
      left: 34.4%;
      top: 60.6%;
      width: 31.5%;
      height: 37%;
    }

    .mission-3 {
      left: 67.1%;
      top: 60.6%;
      width: 30.7%;
      height: 37%;
    }

    .status {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 5%;
      min-height: 14%;
      display: grid;
      place-items: center;
      border: 4px solid rgba(255, 255, 255, .96);
      border-radius: 20px;
      color: #fff;
      font-size: clamp(14px, 2.4vw, 30px);
      font-weight: 900;
      line-height: 1.15;
      text-align: center;
      text-shadow: 0 2px 0 rgba(0, 0, 0, .14);
      box-shadow: 0 8px 0 rgba(48, 69, 92, .18);
    }

    .mission-1 .status { background: #2387d6; }
    .mission-2 .status { background: #66b948; }
    .mission-3 .status { background: #f28a24; }

    .mission.done .status {
      background: #28a95f;
    }

    .mission.locked {
      pointer-events: none;
    }

    .mission.locked .status {
      background: rgba(104, 102, 95, .88);
    }

    .mission.locked::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 28px;
      background: rgba(255, 255, 255, .18);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .reset-row {
      display: flex;
      justify-content: center;
      margin-top: 22px;
    }

    button {
      border: 5px solid #fff;
      border-radius: 999px;
      padding: 13px 24px;
      background: #fff6d7;
      color: #654012;
      font: inherit;
      font-size: clamp(18px, 2.4vw, 26px);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 0 #d69a30, 0 14px 28px rgba(64, 84, 108, .18);
    }

    button:hover {
      transform: translateY(-2px);
    }

    @media (max-width: 680px) {
      .page {
        width: min(100% - 12px, 1260px);
        padding-top: 8px;
      }

      .cover {
        border-width: 5px;
        border-radius: 22px;
      }

      .mission {
        border-radius: 16px;
      }

      .status {
        border-width: 2px;
        border-radius: 12px;
        box-shadow: 0 4px 0 rgba(48, 69, 92, .16);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="cover" aria-label="單位分數冒險島三關闖關封面">
      <img class="cover-image" src="assets/unit-fraction-adventure-cover.png" alt="單位分數冒險島，三關闖關任務：一樣大才公平、披薩分數店、分數對抗賽。">

      <a class="mission mission-1" data-lesson="9-1" data-local="9-1一樣大平分自學網頁.html" data-pub="9-1-equal-sharing.html" href="#">
        <span class="sr-only">第一關，一樣大才公平</span>
        <span class="status">開始挑戰</span>
      </a>

      <a class="mission mission-2" data-lesson="9-2" data-local="9-2披薩分數店自學網頁.html" data-pub="9-2-pizza-fraction-shop.html" href="#">
        <span class="sr-only">第二關，披薩分數店</span>
        <span class="status">完成第 1 關後開啟</span>
      </a>

      <a class="mission mission-3" data-lesson="9-3" data-local="9-3分數對抗賽自學網頁.html" data-pub="9-3-unit-fraction-race.html" href="#">
        <span class="sr-only">第三關，分數對抗賽</span>
        <span class="status">完成第 2 關後開啟</span>
      </a>
    </section>

    <div class="reset-row">
      <button type="button" id="resetProgress">重新開始三關</button>
    </div>
  </main>

  <script>
    const lessons = [...document.querySelectorAll(".mission")];
    const isPublished = location.hostname.includes("github.io") || location.pathname.includes("/github-pages-v2/");
    const hubName = "unit-fraction-learning-island.html";
    const keys = ["unitFraction.lesson.9-1", "unitFraction.lesson.9-2", "unitFraction.lesson.9-3"];

    function updateLinks() {
      lessons.forEach((card, index) => {
        const target = isPublished ? card.dataset.pub : card.dataset.local;
        card.href = `${target}?hub=${encodeURIComponent(hubName)}`;
        const done = localStorage.getItem(keys[index]) === "done";
        const unlocked = index === 0 || localStorage.getItem(keys[index - 1]) === "done";
        card.classList.toggle("done", done);
        card.classList.toggle("locked", !unlocked);
        const status = card.querySelector(".status");
        if (done) status.textContent = "已完成，還可以再玩";
        else if (unlocked) status.textContent = "開始挑戰";
        else status.textContent = `完成第 ${index} 關後開啟`;
      });
    }

    document.getElementById("resetProgress").addEventListener("click", () => {
      keys.forEach(key => localStorage.removeItem(key));
      updateLinks();
    });

    updateLinks();
  </script>
</body>
</html>
