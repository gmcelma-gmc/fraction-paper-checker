<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>單位分數自學島</title>
  <style>
    :root {
      --ink: #243043;
      --muted: #65738a;
      --line: #cbd8e8;
      --paper: #fffdf7;
      --blue: #3b82c4;
      --green: #2f9e66;
      --gold: #f4b545;
      --rose: #f07d70;
      --shadow: 0 16px 36px rgba(54, 72, 95, .15);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
      background:
        radial-gradient(circle at 13% 10%, rgba(255, 222, 98, .72), transparent 19rem),
        radial-gradient(circle at 86% 16%, rgba(143, 217, 255, .72), transparent 24rem),
        radial-gradient(circle at 58% 2%, rgba(255, 169, 158, .32), transparent 17rem),
        linear-gradient(180deg, #fffdf4 0%, #eef9ff 52%, #ecfff3 100%);
    }

    a { color: inherit; }

    .island {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 42px;
    }

    .cover {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, .92fr) minmax(320px, 1.08fr);
      gap: 8px 28px;
      align-items: center;
      min-height: min(660px, 82vh);
      padding: clamp(22px, 4.2vw, 48px);
      border: 5px solid #f0c86c;
      border-radius: 34px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.86), rgba(255,251,230,.78)),
        radial-gradient(circle at 18% 22%, rgba(255,221,110,.42), transparent 18rem);
      box-shadow: 0 20px 42px rgba(124, 114, 63, .18);
      overflow: hidden;
    }

    .cover::before,
    .cover::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      background: rgba(255, 255, 255, .76);
      box-shadow:
        52px 6px 0 rgba(255, 255, 255, .68),
        104px -2px 0 rgba(255, 255, 255, .6);
      pointer-events: none;
    }

    .cover::before {
      width: 82px;
      height: 34px;
      left: 34px;
      top: 30px;
    }

    .cover::after {
      width: 70px;
      height: 30px;
      right: 138px;
      top: 78px;
    }

    .cover-title {
      position: relative;
      z-index: 1;
      grid-column: 1 / -1;
      text-align: center;
    }

    .cover-kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      padding: 8px 18px;
      border: 3px solid #8ed0b0;
      border-radius: 999px;
      background: #f1fff6;
      color: #2f604e;
      font-size: clamp(18px, 2vw, 26px);
      font-weight: 900;
      box-shadow: 0 8px 0 rgba(47, 96, 78, .12);
    }

    .cover h1 {
      margin: 0;
      font-size: clamp(40px, 7vw, 82px);
      line-height: 1;
      letter-spacing: 0;
      white-space: nowrap;
      color: #243043;
      text-shadow:
        0 5px 0 #ffe69c,
        0 10px 22px rgba(95, 72, 31, .12);
    }

    .cover p {
      position: relative;
      z-index: 1;
      max-width: 650px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: clamp(22px, 2.25vw, 32px);
      line-height: 1.55;
      font-weight: 800;
    }

    .cover-copy {
      position: relative;
      z-index: 1;
      align-self: start;
      padding: 18px 4px 10px;
    }

    .cover-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    .cover-badges span {
      padding: 10px 16px;
      border: 3px solid #b9d3c6;
      border-radius: 999px;
      background: #fffef0;
      color: #2f604e;
      font-size: 22px;
      font-weight: 900;
      box-shadow: 0 7px 0 rgba(47, 96, 78, .12);
    }

    .island-art {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
    }

    .island-art svg {
      width: min(560px, 94vw);
      filter: drop-shadow(0 20px 26px rgba(54, 72, 95, .18));
      animation: floatIsland 3s ease-in-out infinite alternate;
    }

    @keyframes floatIsland {
      from { transform: translateY(0) rotate(-1deg); }
      to { transform: translateY(-12px) rotate(1.5deg); }
    }

    .missions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-top: 22px;
    }

    .mission {
      position: relative;
      display: grid;
      gap: 14px;
      min-height: 380px;
      padding: 22px;
      border: 4px solid var(--line);
      border-radius: 24px;
      background: #fff;
      box-shadow: var(--shadow);
      text-decoration: none;
      overflow: hidden;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }

    .mission:hover {
      transform: translateY(-4px);
      border-color: #7ccf93;
      box-shadow: 0 20px 42px rgba(54, 72, 95, .18);
    }

    .mission-no {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--blue);
      color: #fff;
      font-size: 36px;
      font-weight: 900;
      box-shadow: inset 0 0 0 5px rgba(255,255,255,.28);
    }

    .mission h2 {
      margin: 0;
      font-size: clamp(28px, 3vw, 40px);
      line-height: 1.18;
    }

    .mission p {
      margin: 0;
      color: var(--muted);
      font-size: 22px;
      line-height: 1.5;
      font-weight: 800;
    }

    .mission svg {
      width: 100%;
      height: 120px;
      align-self: end;
    }

    .status {
      justify-self: start;
      padding: 8px 14px;
      border-radius: 999px;
      background: #fff6d7;
      color: #85570d;
      font-size: 20px;
      font-weight: 900;
    }

    .mission.done .status {
      background: #e6fff0;
      color: #17633d;
    }

    .mission.locked {
      opacity: .68;
      pointer-events: none;
      filter: grayscale(.1);
    }

    .mission.locked::after {
      content: "先完成前一關";
      position: absolute;
      inset: auto 18px 18px;
      padding: 10px 14px;
      border-radius: 16px;
      background: rgba(36, 48, 67, .86);
      color: #fff;
      text-align: center;
      font-size: 22px;
      font-weight: 900;
    }

    .reset-row {
      display: flex;
      justify-content: center;
      margin-top: 24px;
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 12px 18px;
      background: #fff;
      color: var(--ink);
      border: 3px solid var(--line);
      font: inherit;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
    }

    @media (max-width: 900px) {
      .cover,
      .missions {
        grid-template-columns: 1fr;
      }
      .cover {
        min-height: auto;
      }

      .cover h1 {
        font-size: clamp(24px, 7vw, 58px);
      }
    }
  </style>
</head>
<body>
  <main class="island">
    <section class="cover">
      <div class="cover-title">
        <div class="cover-kicker">三關闖關任務</div>
        <h1>單位分數自學島</h1>
      </div>
      <div class="cover-copy">
        <p>一起搭上分數小船，先找公平平分，再開披薩分數店，最後挑戰分數對抗賽。</p>
        <div class="cover-badges">
          <span>動手玩</span>
          <span>看圖想</span>
          <span>說理由</span>
        </div>
      </div>
      <div class="island-art" aria-hidden="true">
        <svg viewBox="0 0 560 380">
          <path d="M82 296c86 54 312 54 396 0" fill="none" stroke="#a5dcff" stroke-width="42" stroke-linecap="round"/>
          <path d="M54 255c84-112 366-112 452 0 18 23 8 63-22 70-102 23-306 23-408 0-30-7-40-47-22-70Z" fill="#c9f2cc" stroke="#2f604e" stroke-width="9"/>
          <path d="M108 276c88 26 252 30 344 0" fill="none" stroke="#ffe06f" stroke-width="18" stroke-linecap="round"/>
          <path d="M113 252c48-31 98-46 151-45M317 208c48 2 92 17 130 44" fill="none" stroke="#f9b84a" stroke-width="8" stroke-linecap="round" stroke-dasharray="1 18"/>

          <g transform="translate(58 68)">
            <circle cx="86" cy="86" r="66" fill="#ffd873" stroke="#c9822e" stroke-width="9"/>
            <path d="M86 20v132M20 86h132" stroke="#fffdf7" stroke-width="8"/>
            <circle cx="68" cy="64" r="7" fill="#d85743"/>
            <circle cx="104" cy="108" r="8" fill="#478c57"/>
            <circle cx="112" cy="58" r="6" fill="#c9822e"/>
            <path d="M62 89c18 14 35 14 52 0" fill="none" stroke="#7b4a20" stroke-width="6" stroke-linecap="round"/>
            <circle cx="62" cy="78" r="5" fill="#243043"/>
            <circle cx="112" cy="78" r="5" fill="#243043"/>
          </g>

          <g transform="translate(268 74)">
            <rect x="0" y="12" width="166" height="44" rx="22" fill="#fff8d8" stroke="#28445f" stroke-width="8"/>
            <rect x="0" y="12" width="83" height="44" rx="22" fill="#f4ca58"/>
            <rect x="18" y="92" width="166" height="44" rx="22" fill="#fff8d8" stroke="#28445f" stroke-width="8"/>
            <rect x="18" y="92" width="42" height="44" rx="22" fill="#9bd6b8"/>
            <path d="M178 0l16 33 36 5-26 25 6 36-32-17-32 17 6-36-26-25 36-5Z" fill="#f4b545" stroke="#9a6722" stroke-width="7"/>
          </g>

          <g transform="translate(220 205)">
            <path d="M0 42c40-28 78-28 118 0-35 28-82 28-118 0Z" fill="#8ed0b0" stroke="#2f604e" stroke-width="7"/>
            <path d="M55 18c26 0 48 13 63 24-38 21-78 20-118 0 14-11 32-24 55-24Z" fill="#fff5cb" stroke="#2f604e" stroke-width="7"/>
            <circle cx="54" cy="43" r="9" fill="#3b82c4"/>
            <path d="M142 38c28-12 56 5 62 32-31 10-56-1-62-32Z" fill="#f07d70" stroke="#9e5048" stroke-width="6"/>
          </g>

          <g transform="translate(82 38)">
            <path d="M0 16c24-22 54-22 78 0M396 34c24-22 54-22 78 0" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round"/>
          </g>
        </svg>
      </div>
    </section>

    <section class="missions" aria-label="三個自學活動">
      <a class="mission" data-lesson="9-1" data-local="9-1一樣大平分自學網頁.html" data-pub="9-1-equal-sharing.html" href="#">
        <span class="mission-no">1</span>
        <h2>一樣大才公平</h2>
        <p>切一切、疊一疊，確認每一份一樣大。</p>
        <span class="status">開始挑戰</span>
        <svg viewBox="0 0 260 120" aria-hidden="true">
          <rect x="36" y="18" width="150" height="78" rx="12" fill="#fff7d7" stroke="#28445f" stroke-width="7"/>
          <path d="M111 18v78M36 57h150" stroke="#e48c77" stroke-width="7" stroke-linecap="round"/>
          <circle cx="204" cy="32" r="22" fill="#7ccf93" stroke="#28445f" stroke-width="5"/>
          <path d="M192 32l8 8 16-20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

      <a class="mission" data-lesson="9-2" data-local="9-2披薩分數店自學網頁.html" data-pub="9-2-pizza-fraction-shop.html" href="#">
        <span class="mission-no">2</span>
        <h2>披薩分數店</h2>
        <p>看圖說分數，知道拿其中一份就是幾分之一。</p>
        <span class="status">完成第 1 關後開啟</span>
        <svg viewBox="0 0 260 120" aria-hidden="true">
          <circle cx="95" cy="58" r="46" fill="#ffd873" stroke="#c9822e" stroke-width="8"/>
          <path d="M95 12v92M49 58h92" stroke="#fffdf7" stroke-width="7"/>
          <path d="M95 58L141 58A46 46 0 0 0 95 12Z" fill="#ffeaa5"/>
          <circle cx="75" cy="45" r="5" fill="#d85743"/>
          <circle cx="113" cy="78" r="6" fill="#478c57"/>
          <path d="M174 36c18 16 18 44 0 60" fill="none" stroke="#3b82c4" stroke-width="9" stroke-linecap="round"/>
        </svg>
      </a>

      <a class="mission" data-lesson="9-3" data-local="9-3分數對抗賽自學網頁.html" data-pub="9-3-unit-fraction-race.html" href="#">
        <span class="mission-no">3</span>
        <h2>分數對抗賽</h2>
        <p>整條一樣長時，切越多段，每一份越小。</p>
        <span class="status">完成第 2 關後開啟</span>
        <svg viewBox="0 0 260 120" aria-hidden="true">
          <rect x="30" y="24" width="160" height="22" rx="11" fill="#fff8d8" stroke="#28445f" stroke-width="7"/>
          <rect x="30" y="24" width="80" height="22" rx="11" fill="#f3c451"/>
          <rect x="30" y="70" width="160" height="22" rx="11" fill="#fff8d8" stroke="#28445f" stroke-width="7"/>
          <rect x="30" y="70" width="40" height="22" rx="11" fill="#8ed0b0"/>
          <path d="M205 20l10 21 23 3-17 16 4 23-20-11-20 11 4-23-17-16 23-3Z" fill="#f4b545" stroke="#9a6722" stroke-width="5"/>
        </svg>
      </a>
    </section>

    <div class="reset-row">
      <button type="button" id="resetProgress">重新開始三關</button>
    </div>
  </main>

  <script>
    const lessons = [...document.querySelectorAll(".mission")];
    const isPublished = location.hostname.includes("github.io") || location.pathname.includes("/github-pages-v2/");
    const hubName = "unit-fraction-learning-island.html";
    const keys = ["unitFraction.lesson.9-1", "unitFraction.lesson.9-2", "unitFraction.lesson.9-3"];

    function updateLinks() {
      lessons.forEach((card, index) => {
        const target = isPublished ? card.dataset.pub : card.dataset.local;
        card.href = `${target}?hub=${encodeURIComponent(hubName)}`;
        const done = localStorage.getItem(keys[index]) === "done";
        const unlocked = index === 0 || localStorage.getItem(keys[index - 1]) === "done";
        card.classList.toggle("done", done);
        card.classList.toggle("locked", !unlocked);
        const status = card.querySelector(".status");
        if (done) status.textContent = "已完成";
        else if (unlocked) status.textContent = "開始挑戰";
        else status.textContent = `完成第 ${index} 關後開啟`;
      });
    }

    document.getElementById("resetProgress").addEventListener("click", () => {
      keys.forEach(key => localStorage.removeItem(key));
      updateLinks();
    });

    updateLinks();
  </script>
</body>
</html>
