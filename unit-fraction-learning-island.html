<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>單位分數自學島</title>
  <style>
    :root {
      --ink: #243043;
      --muted: #65738a;
      --line: #cbd8e8;
      --paper: #fffdf7;
      --blue: #3b82c4;
      --green: #2f9e66;
      --gold: #f4b545;
      --rose: #f07d70;
      --shadow: 0 16px 36px rgba(54, 72, 95, .15);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
      background:
        radial-gradient(circle at 10% 8%, rgba(255, 225, 122, .55), transparent 24rem),
        radial-gradient(circle at 88% 12%, rgba(160, 224, 255, .58), transparent 25rem),
        linear-gradient(180deg, #f9fcff 0%, #edf8f2 100%);
    }

    a { color: inherit; }

    .island {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 42px;
    }

    .cover {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(280px, .9fr);
      gap: 22px;
      align-items: center;
      min-height: min(620px, 78vh);
      padding: clamp(24px, 5vw, 54px);
      border: 4px solid var(--line);
      border-radius: 28px;
      background: rgba(255, 253, 247, .86);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .cover h1 {
      margin: 0;
      font-size: clamp(46px, 7vw, 86px);
      line-height: 1.04;
      letter-spacing: 0;
    }

    .cover p {
      max-width: 760px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: clamp(22px, 2.5vw, 34px);
      line-height: 1.55;
      font-weight: 800;
    }

    .cover-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    .cover-badges span {
      padding: 10px 16px;
      border: 3px solid #b9d3c6;
      border-radius: 999px;
      background: #f0fff6;
      color: #2f604e;
      font-size: 22px;
      font-weight: 900;
    }

    .island-art {
      display: grid;
      place-items: center;
    }

    .island-art svg {
      width: min(420px, 90vw);
      filter: drop-shadow(0 18px 24px rgba(54, 72, 95, .16));
      animation: floatIsland 2.8s ease-in-out infinite alternate;
    }

    @keyframes floatIsland {
      from { transform: translateY(0) rotate(-1deg); }
      to { transform: translateY(-12px) rotate(1.5deg); }
    }

    .missions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-top: 22px;
    }

    .mission {
      position: relative;
      display: grid;
      gap: 14px;
      min-height: 380px;
      padding: 22px;
      border: 4px solid var(--line);
      border-radius: 24px;
      background: #fff;
      box-shadow: var(--shadow);
      text-decoration: none;
      overflow: hidden;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }

    .mission:hover {
      transform: translateY(-4px);
      border-color: #7ccf93;
      box-shadow: 0 20px 42px rgba(54, 72, 95, .18);
    }

    .mission-no {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--blue);
      color: #fff;
      font-size: 36px;
      font-weight: 900;
      box-shadow: inset 0 0 0 5px rgba(255,255,255,.28);
    }

    .mission h2 {
      margin: 0;
      font-size: clamp(28px, 3vw, 40px);
      line-height: 1.18;
    }

    .mission p {
      margin: 0;
      color: var(--muted);
      font-size: 22px;
      line-height: 1.5;
      font-weight: 800;
    }

    .mission svg {
      width: 100%;
      height: 120px;
      align-self: end;
    }

    .status {
      justify-self: start;
      padding: 8px 14px;
      border-radius: 999px;
      background: #fff6d7;
      color: #85570d;
      font-size: 20px;
      font-weight: 900;
    }

    .mission.done .status {
      background: #e6fff0;
      color: #17633d;
    }

    .mission.locked {
      opacity: .68;
      pointer-events: none;
      filter: grayscale(.1);
    }

    .mission.locked::after {
      content: "先完成前一關";
      position: absolute;
      inset: auto 18px 18px;
      padding: 10px 14px;
      border-radius: 16px;
      background: rgba(36, 48, 67, .86);
      color: #fff;
      text-align: center;
      font-size: 22px;
      font-weight: 900;
    }

    .reset-row {
      display: flex;
      justify-content: center;
      margin-top: 24px;
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 12px 18px;
      background: #fff;
      color: var(--ink);
      border: 3px solid var(--line);
      font: inherit;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
    }

    @media (max-width: 900px) {
      .cover,
      .missions {
        grid-template-columns: 1fr;
      }
      .cover {
        min-height: auto;
      }
    }
  </style>
</head>
<body>
  <main class="island">
    <section class="cover">
      <div>
        <h1>單位分數自學島</h1>
        <p>跟著三個任務，從「一樣大才公平」出發，認識幾分之一，最後用長條圖比較單位分數大小。</p>
        <div class="cover-badges">
          <span>先操作</span>
          <span>再觀察</span>
          <span>會說理由</span>
        </div>
      </div>
      <div class="island-art" aria-hidden="true">
        <svg viewBox="0 0 420 310">
          <path d="M56 214c70-82 238-82 308 0 12 15 4 42-17 46-78 17-196 17-274 0-21-4-29-31-17-46Z" fill="#bfe9c9" stroke="#2f604e" stroke-width="8"/>
          <circle cx="130" cy="112" r="54" fill="#ffd873" stroke="#c9822e" stroke-width="8"/>
          <path d="M130 58v108M76 112h108" stroke="#fffdf7" stroke-width="7"/>
          <rect x="214" y="70" width="126" height="38" rx="18" fill="#fff8d8" stroke="#28445f" stroke-width="7"/>
          <rect x="214" y="70" width="63" height="38" rx="18" fill="#f3c451"/>
          <rect x="214" y="132" width="126" height="38" rx="18" fill="#fff8d8" stroke="#28445f" stroke-width="7"/>
          <rect x="214" y="132" width="32" height="38" rx="18" fill="#8ed0b0"/>
          <path d="M122 232c52 18 126 18 178 0" fill="none" stroke="#f0b84a" stroke-width="12" stroke-linecap="round"/>
          <path d="M320 42l13 27 30 4-22 21 5 30-26-14-26 14 5-30-22-21 30-4Z" fill="#f4b545" stroke="#9a6722" stroke-width="6"/>
        </svg>
      </div>
    </section>

    <section class="missions" aria-label="三個自學活動">
      <a class="mission" data-lesson="9-1" data-local="9-1一樣大平分自學網頁.html" data-pub="9-1-equal-sharing.html" href="#">
        <span class="mission-no">1</span>
        <h2>一樣大才公平</h2>
        <p>切一切、疊一疊，確認每一份一樣大。</p>
        <span class="status">開始挑戰</span>
        <svg viewBox="0 0 260 120" aria-hidden="true">
          <rect x="36" y="18" width="150" height="78" rx="12" fill="#fff7d7" stroke="#28445f" stroke-width="7"/>
          <path d="M111 18v78M36 57h150" stroke="#e48c77" stroke-width="7" stroke-linecap="round"/>
          <circle cx="204" cy="32" r="22" fill="#7ccf93" stroke="#28445f" stroke-width="5"/>
          <path d="M192 32l8 8 16-20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

      <a class="mission" data-lesson="9-2" data-local="9-2披薩分數店自學網頁.html" data-pub="9-2-pizza-fraction-shop.html" href="#">
        <span class="mission-no">2</span>
        <h2>披薩分數店</h2>
        <p>看圖說分數，知道拿其中一份就是幾分之一。</p>
        <span class="status">完成第 1 關後開啟</span>
        <svg viewBox="0 0 260 120" aria-hidden="true">
          <circle cx="95" cy="58" r="46" fill="#ffd873" stroke="#c9822e" stroke-width="8"/>
          <path d="M95 12v92M49 58h92" stroke="#fffdf7" stroke-width="7"/>
          <path d="M95 58L141 58A46 46 0 0 0 95 12Z" fill="#ffeaa5"/>
          <circle cx="75" cy="45" r="5" fill="#d85743"/>
          <circle cx="113" cy="78" r="6" fill="#478c57"/>
          <path d="M174 36c18 16 18 44 0 60" fill="none" stroke="#3b82c4" stroke-width="9" stroke-linecap="round"/>
        </svg>
      </a>

      <a class="mission" data-lesson="9-3" data-local="9-3分數對抗賽自學網頁.html" data-pub="9-3-unit-fraction-race.html" href="#">
        <span class="mission-no">3</span>
        <h2>分數對抗賽</h2>
        <p>整條一樣長時，切越多段，每一份越小。</p>
        <span class="status">完成第 2 關後開啟</span>
        <svg viewBox="0 0 260 120" aria-hidden="true">
          <rect x="30" y="24" width="160" height="22" rx="11" fill="#fff8d8" stroke="#28445f" stroke-width="7"/>
          <rect x="30" y="24" width="80" height="22" rx="11" fill="#f3c451"/>
          <rect x="30" y="70" width="160" height="22" rx="11" fill="#fff8d8" stroke="#28445f" stroke-width="7"/>
          <rect x="30" y="70" width="40" height="22" rx="11" fill="#8ed0b0"/>
          <path d="M205 20l10 21 23 3-17 16 4 23-20-11-20 11 4-23-17-16 23-3Z" fill="#f4b545" stroke="#9a6722" stroke-width="5"/>
        </svg>
      </a>
    </section>

    <div class="reset-row">
      <button type="button" id="resetProgress">重新開始三關</button>
    </div>
  </main>

  <script>
    const lessons = [...document.querySelectorAll(".mission")];
    const isPublished = location.hostname.includes("github.io") || location.pathname.includes("/github-pages-v2/");
    const hubName = "unit-fraction-learning-island.html";
    const keys = ["unitFraction.lesson.9-1", "unitFraction.lesson.9-2", "unitFraction.lesson.9-3"];

    function updateLinks() {
      lessons.forEach((card, index) => {
        const target = isPublished ? card.dataset.pub : card.dataset.local;
        card.href = `${target}?hub=${encodeURIComponent(hubName)}`;
        const done = localStorage.getItem(keys[index]) === "done";
        const unlocked = index === 0 || localStorage.getItem(keys[index - 1]) === "done";
        card.classList.toggle("done", done);
        card.classList.toggle("locked", !unlocked);
        const status = card.querySelector(".status");
        if (done) status.textContent = "已完成";
        else if (unlocked) status.textContent = "開始挑戰";
        else status.textContent = `完成第 ${index} 關後開啟`;
      });
    }

    document.getElementById("resetProgress").addEventListener("click", () => {
      keys.forEach(key => localStorage.removeItem(key));
      updateLinks();
    });

    updateLinks();
  </script>
</body>
</html>
