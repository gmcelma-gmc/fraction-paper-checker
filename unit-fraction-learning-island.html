<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>單位分數自學島</title>
  <style>
    :root {
      --ink: #243043;
      --muted: #65738a;
      --line: #cbd8e8;
      --paper: #fffdf7;
      --blue: #3b82c4;
      --green: #2f9e66;
      --gold: #f4b545;
      --rose: #f07d70;
      --shadow: 0 16px 36px rgba(54, 72, 95, .15);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
      background:
        radial-gradient(circle at 12% 12%, rgba(255, 230, 95, .72), transparent 16rem),
        radial-gradient(circle at 86% 18%, rgba(255, 137, 166, .38), transparent 19rem),
        radial-gradient(circle at 53% 2%, rgba(124, 213, 255, .78), transparent 25rem),
        linear-gradient(180deg, #dff6ff 0%, #fff7d6 50%, #e9ffe9 100%);
    }

    a { color: inherit; }

    .island {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 42px;
    }

    .cover {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, .72fr) minmax(360px, 1.28fr);
      gap: 4px 24px;
      align-items: center;
      min-height: min(700px, 86vh);
      padding: clamp(20px, 3.8vw, 44px);
      border: 7px solid #ffffff;
      border-radius: 38px;
      background:
        linear-gradient(180deg, rgba(198, 237, 255, .92) 0%, rgba(255, 251, 222, .92) 62%, rgba(202, 244, 201, .96) 100%);
      box-shadow:
        0 0 0 7px #f5c751,
        0 22px 44px rgba(60, 75, 103, .2);
      overflow: hidden;
    }

    .cover::before,
    .cover::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      background: rgba(255, 255, 255, .76);
      box-shadow:
        52px 6px 0 rgba(255, 255, 255, .68),
        104px -2px 0 rgba(255, 255, 255, .6);
      pointer-events: none;
    }

    .cover::before {
      width: 82px;
      height: 34px;
      left: 34px;
      top: 30px;
    }

    .cover::after {
      width: 70px;
      height: 30px;
      right: 138px;
      top: 78px;
    }

    .cover-ground {
      position: absolute;
      left: -6%;
      right: -6%;
      bottom: -14%;
      height: 42%;
      border-radius: 50% 50% 0 0;
      background:
        radial-gradient(circle at 18% 18%, rgba(255,255,255,.5), transparent 10rem),
        linear-gradient(180deg, #8ee2a7 0%, #5ec28a 100%);
      border-top: 7px solid #2f604e;
      z-index: 0;
    }

    .cover-title {
      position: relative;
      z-index: 2;
      grid-column: 1 / -1;
      text-align: center;
    }

    .cover-kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      padding: 8px 18px;
      border: 4px solid #ffffff;
      border-radius: 999px;
      background: #ff7f8f;
      color: #ffffff;
      font-size: clamp(18px, 2vw, 26px);
      font-weight: 900;
      box-shadow: 0 8px 0 #b94b58;
    }

    .cover h1 {
      margin: 0;
      font-size: clamp(40px, 6.6vw, 78px);
      line-height: 1;
      letter-spacing: 0;
      white-space: nowrap;
      color: #22304a;
      text-shadow:
        0 6px 0 #ffe56d,
        0 10px 0 #ff9fb0,
        0 18px 26px rgba(49, 60, 86, .18);
    }

    .cover p {
      position: relative;
      z-index: 2;
      max-width: 650px;
      margin: 14px 0 0;
      color: #35506a;
      font-size: clamp(22px, 2.25vw, 32px);
      line-height: 1.55;
      font-weight: 800;
    }

    .cover-copy {
      position: relative;
      z-index: 2;
      align-self: start;
      padding: 20px;
      border: 5px solid #ffffff;
      border-radius: 26px;
      background: rgba(255, 255, 255, .72);
      box-shadow: 0 12px 0 rgba(72, 126, 98, .13);
    }

    .cover-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    .cover-badges span {
      padding: 10px 16px;
      border: 4px solid #ffffff;
      border-radius: 999px;
      background: #ffdf5c;
      color: #5c3b00;
      font-size: 22px;
      font-weight: 900;
      box-shadow: 0 7px 0 #d7952c;
    }

    .island-art {
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
    }

    .island-art svg {
      width: min(650px, 96vw);
      filter: drop-shadow(0 22px 24px rgba(54, 72, 95, .2));
      animation: floatIsland 2.6s ease-in-out infinite alternate;
    }

    @keyframes floatIsland {
      from { transform: translateY(0) rotate(-1deg); }
      to { transform: translateY(-12px) rotate(1.5deg); }
    }

    .missions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-top: 28px;
    }

    .mission {
      position: relative;
      display: grid;
      gap: 14px;
      min-height: 380px;
      padding: 22px;
      border: 5px solid #ffffff;
      border-radius: 24px;
      background: linear-gradient(180deg, #ffffff 0%, #fff9de 100%);
      box-shadow:
        0 0 0 4px var(--line),
        0 16px 0 rgba(67, 94, 121, .14);
      text-decoration: none;
      overflow: hidden;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }

    .mission:hover {
      transform: translateY(-4px);
      box-shadow:
        0 0 0 4px #7ccf93,
        0 20px 0 rgba(67, 94, 121, .12);
    }

    .mission-no {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--blue);
      color: #fff;
      font-size: 36px;
      font-weight: 900;
      box-shadow: inset 0 0 0 5px rgba(255,255,255,.28);
    }

    .mission h2 {
      margin: 0;
      font-size: clamp(28px, 3vw, 40px);
      line-height: 1.18;
    }

    .mission p {
      margin: 0;
      color: var(--muted);
      font-size: 22px;
      line-height: 1.5;
      font-weight: 800;
    }

    .mission svg {
      width: 100%;
      height: 120px;
      align-self: end;
    }

    .status {
      justify-self: start;
      padding: 8px 14px;
      border-radius: 999px;
      background: #fff6d7;
      color: #85570d;
      font-size: 20px;
      font-weight: 900;
    }

    .mission.done .status {
      background: #e6fff0;
      color: #17633d;
    }

    .mission.locked {
      opacity: .68;
      pointer-events: none;
      filter: grayscale(.1);
    }

    .mission.locked::after {
      content: "先完成前一關";
      position: absolute;
      inset: auto 18px 18px;
      padding: 10px 14px;
      border-radius: 16px;
      background: rgba(36, 48, 67, .86);
      color: #fff;
      text-align: center;
      font-size: 22px;
      font-weight: 900;
    }

    .reset-row {
      display: flex;
      justify-content: center;
      margin-top: 24px;
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 12px 18px;
      background: #fff;
      color: var(--ink);
      border: 3px solid var(--line);
      font: inherit;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
    }

      @media (max-width: 900px) {
      .cover,
      .missions {
        grid-template-columns: 1fr;
      }
      .cover {
        min-height: auto;
      }

      .cover h1 {
        font-size: clamp(24px, 7vw, 58px);
      }

      .cover-copy {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="island">
    <section class="cover">
      <div class="cover-ground" aria-hidden="true"></div>
      <div class="cover-title">
        <div class="cover-kicker">三關闖關任務</div>
        <h1>單位分數自學島</h1>
      </div>
      <div class="cover-copy">
        <p>一起搭上分數小船，先找公平平分，再開披薩分數店，最後挑戰分數對抗賽。</p>
        <div class="cover-badges">
          <span>動手玩</span>
          <span>看圖想</span>
          <span>說理由</span>
        </div>
      </div>
      <div class="island-art" aria-hidden="true">
        <svg viewBox="0 0 660 430">
          <defs>

              <stop stop-color="#ff8ca0"/>

          <path d="M56 332c118 54 438 54 548 0" fill="none" stroke="#9de0ff" stroke-width="44" stroke-linecap="round"/>
          <path d="M70 292c96-86 408-86 506 0 20 18 12 52-18 60-118 30-352 30-470 0-30-8-38-42-18-60Z" fill="#8ee2a7" stroke="#2f604e" stroke-width="9"/>
          <path d="M128 318c92 32 292 32 402 0" fill="none" stroke="#ffe66e" stroke-width="20" stroke-linecap="round"/>

          <g transform="translate(238 56)">
            <path d="M20 106h226L198 20H68Z" fill="url(#tent)" stroke="#243043" stroke-width="8" stroke-linejoin="round"/>
            <path d="M68 20l28 86M132 20v86M198 20l-28 86" stroke="#fff7d6" stroke-width="10" stroke-linecap="round"/>
            <rect x="42" y="106" width="184" height="78" rx="18" fill="#fff7d6" stroke="#243043" stroke-width="8"/>
            <path d="M74 184v-52h116v52" fill="#8ed0b0" stroke="#243043" stroke-width="8" stroke-linejoin="round"/>
            <text x="134" y="156" text-anchor="middle" font-size="30" font-weight="900" fill="#243043">分數樂園</text>
            <path d="M36 58h196" stroke="#ffe66e" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 22"/>
          </g>

          <g transform="translate(35 82)">
            <circle cx="102" cy="102" r="84" fill="#ffd873" stroke="#c9822e" stroke-width="10"/>
            <path d="M102 18v168M18 102h168M42 42l120 120M162 42L42 162" stroke="#fffdf7" stroke-width="7"/>
            <circle cx="102" cy="102" r="16" fill="#fff7d6" stroke="#c9822e" stroke-width="6"/>
            <circle cx="101" cy="18" r="13" fill="#ff7f8f" stroke="#243043" stroke-width="5"/>
            <circle cx="186" cy="103" r="13" fill="#8ed0b0" stroke="#243043" stroke-width="5"/>
            <circle cx="101" cy="186" r="13" fill="#7db7ff" stroke="#243043" stroke-width="5"/>
            <circle cx="18" cy="103" r="13" fill="#ffdf5c" stroke="#243043" stroke-width="5"/>
            <path d="M74 116c18 18 42 18 60 0" fill="none" stroke="#7b4a20" stroke-width="7" stroke-linecap="round"/>
            <circle cx="72" cy="91" r="6" fill="#243043"/>
            <circle cx="132" cy="91" r="6" fill="#243043"/>
            <text x="102" y="236" text-anchor="middle" font-size="26" font-weight="900" fill="#243043">披薩轉轉輪</text>
          </g>

          <g transform="translate(425 84)">
            <path d="M74 0l18 38 42 6-30 29 7 41-37-20-37 20 7-41-30-29 42-6Z" fill="url(#gold)" stroke="#9a6722" stroke-width="7"/>
            <rect x="10" y="126" width="176" height="42" rx="21" fill="#fff8d8" stroke="#28445f" stroke-width="8"/>
            <rect x="10" y="126" width="88" height="42" rx="21" fill="#ffdf5c"/>
            <rect x="28" y="190" width="176" height="42" rx="21" fill="#fff8d8" stroke="#28445f" stroke-width="8"/>
            <rect x="28" y="190" width="44" height="42" rx="21" fill="#8ed0b0"/>
            <text x="106" y="276" text-anchor="middle" font-size="26" font-weight="900" fill="#243043">長條雲霄車</text>
          </g>

          <path d="M172 290c58-52 136-52 196 0 40 34 94 32 132-4" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
          <path d="M172 290c58-52 136-52 196 0 40 34 94 32 132-4" fill="none" stroke="#ff9fb0" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 22"/>

          <g transform="translate(174 265)">
            <circle cx="0" cy="0" r="23" fill="#ffdf5c" stroke="#243043" stroke-width="6"/>
            <text x="0" y="9" text-anchor="middle" font-size="26" font-weight="900" fill="#243043">1</text>
          </g>
          <g transform="translate(332 258)">
            <circle cx="0" cy="0" r="23" fill="#7db7ff" stroke="#243043" stroke-width="6"/>
            <text x="0" y="9" text-anchor="middle" font-size="26" font-weight="900" fill="#243043">2</text>
          </g>
          <g transform="translate(500 258)">
            <circle cx="0" cy="0" r="23" fill="#ff7f8f" stroke="#243043" stroke-width="6"/>

          </g>
        </svg>
      </div>
    </section>

    <section class="missions" aria-label="三個自學活動">
      <a class="mission" data-lesson="9-1" data-local="9-1一樣大平分自學網頁.html" data-pub="9-1-equal-sharing.html" href="#">
        <span class="mission-no">1</span>
        <h2>一樣大才公平</h2>
        <p>切一切、疊一疊，確認每一份一樣大。</p>
        <span class="status">開始挑戰</span>
        <svg viewBox="0 0 260 120" aria-hidden="true">
          <rect x="36" y="18" width="150" height="78" rx="12" fill="#fff7d7" stroke="#28445f" stroke-width="7"/>
          <path d="M111 18v78M36 57h150" stroke="#e48c77" stroke-width="7" stroke-linecap="round"/>
          <circle cx="204" cy="32" r="22" fill="#7ccf93" stroke="#28445f" stroke-width="5"/>
          <path d="M192 32l8 8 16-20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

      <a class="mission" data-lesson="9-2" data-local="9-2披薩分數店自學網頁.html" data-pub="9-2-pizza-fraction-shop.html" href="#">
        <span class="mission-no">2</span>
        <h2>披薩分數店</h2>
        <p>看圖說分數，知道拿其中一份就是幾分之一。</p>
        <span class="status">完成第 1 關後開啟</span>
        <svg viewBox="0 0 260 120" aria-hidden="true">
          <circle cx="95" cy="58" r="46" fill="#ffd873" stroke="#c9822e" stroke-width="8"/>
          <path d="M95 12v92M49 58h92" stroke="#fffdf7" stroke-width="7"/>
          <path d="M95 58L141 58A46 46 0 0 0 95 12Z" fill="#ffeaa5"/>
          <circle cx="75" cy="45" r="5" fill="#d85743"/>
          <circle cx="113" cy="78" r="6" fill="#478c57"/>
          <path d="M174 36c18 16 18 44 0 60" fill="none" stroke="#3b82c4" stroke-width="9" stroke-linecap="round"/>
        </svg>
      </a>

      <a class="mission" data-lesson="9-3" data-local="9-3分數對抗賽自學網頁.html" data-pub="9-3-unit-fraction-race.html" href="#">
        <span class="mission-no">3</span>
        <h2>分數對抗賽</h2>
        <p>整條一樣長時，切越多段，每一份越小。</p>
        <span class="status">完成第 2 關後開啟</span>
        <svg viewBox="0 0 260 120" aria-hidden="true">
          <rect x="30" y="24" width="160" height="22" rx="11" fill="#fff8d8" stroke="#28445f" stroke-width="7"/>
          <rect x="30" y="24" width="80" height="22" rx="11" fill="#f3c451"/>
          <rect x="30" y="70" width="160" height="22" rx="11" fill="#fff8d8" stroke="#28445f" stroke-width="7"/>
          <rect x="30" y="70" width="40" height="22" rx="11" fill="#8ed0b0"/>
          <path d="M205 20l10 21 23 3-17 16 4 23-20-11-20 11 4-23-17-16 23-3Z" fill="#f4b545" stroke="#9a6722" stroke-width="5"/>
        </svg>
      </a>
    </section>

    <div class="reset-row">
      <button type="button" id="resetProgress">重新開始三關</button>
    </div>
  </main>

  <script>
    const lessons = [...document.querySelectorAll(".mission")];
    const isPublished = location.hostname.includes("github.io") || location.pathname.includes("/github-pages-v2/");
    const hubName = "unit-fraction-learning-island.html";
    const keys = ["unitFraction.lesson.9-1", "unitFraction.lesson.9-2", "unitFraction.lesson.9-3"];

    function updateLinks() {
      lessons.forEach((card, index) => {
        const target = isPublished ? card.dataset.pub : card.dataset.local;
        card.href = `${target}?hub=${encodeURIComponent(hubName)}`;
        const done = localStorage.getItem(keys[index]) === "done";
        const unlocked = index === 0 || localStorage.getItem(keys[index - 1]) === "done";
        card.classList.toggle("done", done);
        card.classList.toggle("locked", !unlocked);
        const status = card.querySelector(".status");
        if (done) status.textContent = "已完成";
        else if (unlocked) status.textContent = "開始挑戰";
        else status.textContent = `完成第 ${index} 關後開啟`;
      });
    }

    document.getElementById("resetProgress").addEventListener("click", () => {
      keys.forEach(key => localStorage.removeItem(key));
      updateLinks();
    });

    updateLinks();
  </script>
</body>
</html>
