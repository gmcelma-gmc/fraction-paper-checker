  <title>分數能量城｜三關限時動作遊戲</title>
  <style>
    :root{--blue:#1939a0;--deep:#14245e;--cyan:#37d9e8;--yellow:#ffdc4d;--orange:#ff674a;--white:#fffdf2;--ink:#202c59;--green:#28895d}

    .hud{background:#18296f;color:white;display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:11px 17px}.hud strong{color:var(--yellow)}.hud div{font-weight:900;white-space:nowrap}.heart{color:#ff8189;letter-spacing:2px;font-size:1.15rem}.timer-track{height:16px;background:#2857a0;border-bottom:3px solid #0c3072;overflow:hidden}.timer-track span{display:block;height:100%;width:100%;background:linear-gradient(90deg,#48e1dd,#ffe456,#ff7850);transition:width .1s linear}.timer-track.paused span{background:#b28af3}.arena .hero-img{width:clamp(100px,15vw,160px);left:5%;bottom:1%}.arena .dragon-img{width:clamp(115px,20vw,205px);right:4%;bottom:-2%}.arena .station{position:absolute;z-index:2;right:11%;bottom:10%;width:clamp(90px,16vw,160px);height:clamp(90px,16vw,160px);border:8px solid #ffe268;border-radius:50%;background:#48dbe7d9;box-shadow:0 0 20px #fef997, inset 0 0 18px white;display:grid;place-items:center;font-size:clamp(2.5rem,7vw,5rem);animation:pulse 1.4s infinite}.arena .beam{position:absolute;z-index:4;left:28%;bottom:40%;width:0;height:15px;border-radius:999px;background:#9afcff;box-shadow:0 0 22px 11px #26ecff;transform:rotate(-8deg);opacity:0}.arena.fire .beam{animation:laser .55s ease-out}.arena.hit{animation:shake .35s}.arena .combo-burst{position:absolute;z-index:5;left:46%;top:22%;font-size:clamp(1.4rem,4vw,2.3rem);font-weight:1000;color:var(--yellow);text-shadow:3px 4px var(--deep);opacity:0}.arena.fire .combo-burst{animation:burst .75s}.arena-label{position:absolute;z-index:5;left:2%;bottom:4%;background:#18296fea;color:white;border:2px solid #a1f3f2;border-radius:999px;padding:5px 13px;font-weight:900}.boss-hp{position:absolute;z-index:5;right:3%;top:5%;background:#200d4ac7;color:white;border:2px solid #fa7fd0;border-radius:13px;padding:6px 12px;font-weight:900}.boss-hp b{color:#ff829e;font-size:1.25rem}
    .task-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.mission{font-weight:1000;color:#3154ac}.task-title{font-size:clamp(1.35rem,3vw,2rem);line-height:1.28;margin:9px 0 5px}.task-copy{margin:0 0 15px;font-size:1.02rem;font-weight:800}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choices.two{grid-template-columns:repeat(2,1fr)}.target{position:relative;min-height:160px;border:4px solid #4885c9;border-radius:20px;background:linear-gradient(#fff,#eafcff);box-shadow:0 6px 0 #3b71a9;color:var(--deep);font-weight:1000;font-size:1.05rem;padding:8px;animation:float 2s ease-in-out infinite}.target:nth-child(2){animation-delay:-.65s}.target:nth-child(3){animation-delay:-1.3s}.target:hover{border-color:var(--orange);transform:scale(1.03)}.target:disabled{cursor:default;animation:none}.target:disabled:hover{transform:none}.target svg{display:block;max-width:100%;height:auto;margin:5px auto}.target .fraction{font-size:1.34rem;display:block;margin-top:4px}.target .bar-wrap{display:grid;gap:8px;margin:10px 4px}.target .bar{display:grid;height:39px;border:3px solid var(--deep);border-radius:5px;overflow:hidden}.target .bar span{border-right:2px solid var(--deep)}.target .bar span:last-child{border:0}.target .bar span:first-child{background:var(--yellow)}.target .whole{font-size:.85rem;color:#4a5674}.target.correct{background:#e3ffe7;border-color:#2eaf71}.target.wrong{background:#ffeded;border-color:#e46a5f}.status{min-height:48px;background:#e9f7ff;border:2px solid #abd8e5;border-radius:14px;padding:10px 14px;margin:18px 0 10px;font-weight:900}.status.good{background:#e5ffe9;border-color:#67b986;color:#216547}.status.try{background:#fff1df;border-color:#edb36d;color:#874b25}.status:empty{display:none}.action-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-top:17px}.power{background:#ffefb8;color:#6d4214;border:3px solid #d3983b;border-radius:13px;padding:8px 13px;font-weight:1000}.power:disabled{opacity:.55;cursor:default}.power-note{font-size:.88rem;font-weight:800;color:#536079}
    .reward,.finish{text-align:center}.reward-top{background:linear-gradient(145deg,#fbe27d,#ffad69);padding:20px}.reward-top h2{font-size:clamp(1.6rem,4vw,2.65rem);margin:4px 0}.reward-icon{font-size:4.8rem;animation:pop .6s}.reward .pad p{font-size:1.08rem}.power-card{display:inline-block;background:#e4fafd;border:4px solid var(--blue);border-radius:18px;padding:13px 22px;margin:12px auto;box-shadow:0 5px 0 #60a4b3;font-weight:1000;font-size:1.2rem}.finish .art{position:relative;height:220px;background-image:linear-gradient(#133caf80,#34207c88),url('assets/fraction-arcade-arena.webp');background-size:cover;background-position:center;overflow:hidden}.finish .art img{position:absolute;height:85%;bottom:-3%}.finish .art img:first-child{left:10%}.finish .art img:last-child{right:10%;transform:rotate(15deg)}.finish h2{font-size:clamp(1.7rem,4vw,2.7rem);margin:12px 0}.secret{background:#233886;color:white;border:4px solid var(--yellow);border-radius:18px;padding:17px;margin:14px 0;font-weight:1000;font-size:clamp(1.12rem,3vw,1.5rem)}.record{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:16px 0}.record div{background:#e9f8ff;border:3px solid #97d4e4;border-radius:15px;padding:10px;font-weight:900}.record strong{display:block;font-size:1.32rem;color:var(--blue)}
    .finish .art img:first-child{z-index:2;left:5%;height:86%}.finish .art img:last-child{right:2%;top:4%;bottom:auto;height:55%;opacity:.58;transform:rotate(19deg);filter:grayscale(.35)}
    @keyframes bob{50%{transform:translateY(-9px)}}@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 30px 10px #fff38d}}@keyframes float{50%{translate:0 -6px}}@keyframes laser{10%{width:0;opacity:1}70%{width:54%;opacity:1}100%{width:54%;opacity:0}}@keyframes burst{20%{opacity:1;transform:scale(1.4)}90%{opacity:1}100%{opacity:0;transform:translateY(-35px)}}@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}@keyframes pop{from{transform:scale(.3);opacity:0}75%{transform:scale(1.2)}to{transform:scale(1);opacity:1}}
    @media(max-width:650px){.wrap{width:min(100% - 12px,1060px)}.toplinks a{display:none}.banner{height:330px}.banner-copy{max-width:92%;left:4%;top:5%}.banner .hero-img{left:4%;width:125px;bottom:0}.banner .dragon-img{right:2%;width:150px;bottom:1%}.banner-start{bottom:6%;min-height:45px;padding:7px 13px}.route{gap:5px}.route-item{padding:7px 4px;font-size:.86rem}.route-item b{font-size:1.5rem}.route-item small{font-size:.7rem}.hud{grid-template-columns:1fr auto;gap:4px;padding:8px 12px;font-size:.85rem}.arena{height:205px}.arena .hero-img{width:100px;left:2%}.arena .dragon-img{width:125px;right:2%}.arena .station{right:8%;bottom:17%;width:95px;height:95px}.arena-label{font-size:.76rem}.choices{gap:6px}.target{min-height:125px;border-width:3px;padding:5px;font-size:.85rem}.target .fraction{font-size:1.1rem}.target .bar{height:28px}.target .whole{font-size:.72rem}.record{gap:5px}.record div{padding:7px 3px;font-size:.77rem}.record strong{font-size:1.1rem}}
    @media(max-width:380px){.banner{height:305px}.target{min-height:115px}.target svg{max-height:70px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}@media print{body{background:white}.top,.banner,.hud,.arena,.action-row,.foot,.finish .art,.finish .row{display:none!important}.wrap{width:100%;padding:0}.screen{border:0;box-shadow:none}.finish{display:block!important}.finish .pad{padding:0}.secret,.record{break-inside:avoid}}

<body>
  <main class="wrap">
    <div class="top"><a class="logo" href="fraction-final-quest.html"><b>⚡</b>分數能量城</a><div class="toplinks"><a href="unit-fraction-learning-island.html">原本的自學島</a><button class="sound" id="sound" type="button" aria-pressed="false">🔇 音效關</button></div></div>
    <section class="screen" id="home"><div class="banner"><div class="banner-copy"><small>三關・九波・一場魔王戰</small><h1>分數能量城</h1><p>快看圖、快出手！幫小機器人搶回能量核心。</p></div><img class="hero-img" src="assets/fraction-arcade-hero.webp" alt="勇敢的小機器人"><img class="dragon-img" src="assets/fraction-arcade-dragon.webp" alt="淘氣的紫色能量龍"><button class="primary banner-start" id="bannerStart" type="button">⚡ 開始挑戰</button></div><div class="pad"><h2 class="subhead">準備好出招了嗎？</h2><p class="lead">點對圖，發射能量！倒數條會往前跑，答錯可以看提示再試，護盾用完也能補充。</p><div class="route" id="route"></div><div class="home-controls"><label class="mode"><input type="checkbox" id="practice"> 無計時練習</label><div class="row"><button class="primary" id="homeStart" type="button">開始挑戰 ➜</button><button class="soft hidden" id="newGame" type="button">重新開局</button></div></div><p class="muted">預設為限時冒險。進度儲存在這台裝置；無計時練習也有相同的題目與獎勵。</p></div></section>
    <section class="screen hidden" id="game"><div class="hud"><div id="hudStage"></div><div>護盾 <span class="heart" id="hearts"></span></div><div>連擊 <strong id="combo">0</strong></div><div>能量 <strong id="score">0</strong></div></div><div class="timer-track" id="timerTrack"><span id="timerFill"></span></div><div class="arena" id="arena"><img class="hero-img" src="assets/fraction-arcade-hero.webp" alt="小機器人準備發射能量"><img class="dragon-img hidden" id="dragon" src="assets/fraction-arcade-dragon.webp" alt="紫色能量龍"><div class="station" id="station" aria-hidden="true">⚡</div><div class="boss-hp hidden" id="bossHp">魔王能量 <b id="bossHearts">♥♥♥</b></div><div class="beam"></div><div class="combo-burst" id="burst">連擊！</div><div class="arena-label" id="arenaLabel"></div></div><div class="pad"><div class="task-head"><span class="mission" id="mission"></span><span class="power-note" id="waveCount"></span></div><h2 class="task-title" id="taskTitle"></h2><p class="task-copy" id="taskCopy"></p><div class="choices" id="choices" role="group" aria-label="點選你的答案"></div><div class="status" id="status" role="status" aria-live="polite"></div><div class="action-row"><button class="soft" id="back" type="button">◀ 看地圖</button><div class="row"><button class="power hidden" id="power" type="button"></button><button class="secondary hidden" id="retry" type="button">再試這一波</button><button class="primary hidden" id="advance" type="button">下一波 ➜</button></div></div></div></section>
    <section class="screen reward hidden" id="reward"><div class="reward-top"><div class="reward-icon" id="rewardIcon"></div><h2 id="rewardTitle"></h2><p id="rewardSub"></p></div><div class="pad"><div class="power-card" id="rewardPower"></div><p id="rewardHow"></p><button class="primary" id="rewardNext" type="button">帶著道具出發 ➜</button></div></section>
    <section class="screen finish hidden" id="finish"><div class="art"><img src="assets/fraction-arcade-hero.webp" alt="小機器人獲勝"><img src="assets/fraction-arcade-dragon.webp" alt="能量龍被打敗"></div><div class="pad"><p class="mission">✦ 能量核心已找回 ✦</p><h2>你打贏分數能量龍了！</h2><p class="lead">帶著這張秘技卡，去挑戰下一個分數任務。</p><div class="secret">🗝️ 分數秘技：先找完整的「1」，確認「平分」，再比較「每一份」。</div><div class="record" id="record"></div><p class="muted" id="recordNote"></p><div class="row" style="justify-content:center"><button class="secondary" id="print" type="button">列印秘技卡</button><a class="soft" style="display:inline-flex;align-items:center;text-decoration:none" href="unit-fraction-bar-race.html">去分數競技台 ➜</a><button class="soft" id="playAgain" type="button">再打一次</button></div></div></section>
    <footer class="foot">先看圖、再出手，讓數學觀念成為你的超能力。</footer>
  </main>
  <script>
    const KEY='unitFraction.arcade.v3';
    const STAGES=[
      {name:'平分防衛戰',icon:'✂️',intro:'點中每份一樣大的護盾！',reward:'⏱️ 時間暫停器',how:'下一關可按一次，讓倒數暫停 5 秒。'},
      {name:'披薩快遞站',icon:'🍕',intro:'看完整的 1 個披薩，接對訂單！',reward:'🛡️ 能量護盾',how:'魔王關可啟動一次，擋掉一回合的失誤。'},
      {name:'分數魔王戰',icon:'⚡',intro:'同樣長的整條，點比較大的 1 份！',reward:'🏆 分數能量徽章',how:'你已經找回能量核心，秘技卡可以帶去下一個遊戲。'}
    ];
    const PAPER=[
      {n:2,choices:[{cuts:[85],ok:true},{cuts:[53]},{cuts:[116]}],good:'左右兩份一樣大，才叫平分。'},
      {n:3,choices:[{cuts:[58.33,111.67],ok:true},{cuts:[38,102]},{cuts:[68,131]}],good:'三份都一樣大，這張護盾才有能量。'},
      {n:4,choices:[{cuts:[45,85,125],ok:true},{cuts:[34,79,125]},{cuts:[51,91,130]}],good:'四份等大，就是平分成四份。'}
    ];
    const PIZZA=[2,3,4];
    const PAIRS=[[2,4],[3,6],[4,8]];
    const fresh=()=>({stage:0,wave:0,lives:3,score:0,streak:0,first:[],attempts:[],power1Used:false,power2Used:false,shieldArmed:false,cleared:false,rewardPending:false,practice:false});
    let state=fresh(),soundOn=false,context=null,timer=null,deadline=0,lastTick=0,freezeUntil=0,locked=false;
    const el=id=>document.getElementById(id);
    function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
    function load(){try{const data=JSON.parse(localStorage.getItem(KEY));if(data&&Number.isInteger(data.stage)&&data.stage>=0&&data.stage<=3&&Number.isInteger(data.wave)&&data.wave>=0&&data.wave<=2&&Array.isArray(data.first)&&Array.isArray(data.attempts))state=data}catch{}}
    function show(id){['home','game','reward','finish'].forEach(key=>el(key).classList.toggle('hidden',key!==id));if(id==='home')window.scrollTo({top:0,behavior:'instant'});else el(id).scrollIntoView({block:'start',behavior:'instant'})}
    function tone(kind){if(!soundOn)return;try{context??=new (window.AudioContext||window.webkitAudioContext)();const now=context.currentTime;const notes=kind==='good'?[550,760]:kind==='reward'?[520,660,880]:[240];notes.forEach((frequency,i)=>{const o=context.createOscillator(),g=context.createGain();o.type='sine';o.frequency.value=frequency;g.gain.setValueAtTime(.001,now+i*.1);g.gain.exponentialRampToValueAtTime(.14,now+i*.1+.01);g.gain.exponentialRampToValueAtTime(.001,now+i*.1+.18);o.connect(g).connect(context.destination);o.start(now+i*.1);o.stop(now+i*.1+.2)})}catch{}}
    function home(){pause();el('route').innerHTML=STAGES.map((s,i)=>`<div class="route-item ${i<state.stage?'done':i===state.stage?'current':''}"><b aria-hidden="true">${s.icon}</b>${s.name}<small>${i<state.stage?'已突破':i===state.stage?'準備挑戰':'尚未開啟'}</small></div>`).join('');el('practice').checked=state.practice;el('newGame').classList.toggle('hidden',state.stage===0&&state.wave===0&&state.first.length===0);const label=state.stage>=3?'看通關秘技 ➜':state.stage>0||state.wave>0?'繼續戰鬥 ➜':'開始挑戰 ➜';el('homeStart').textContent=label;el('bannerStart').textContent=label;show('home')}
    function paperSvg(cuts){return `<svg viewBox="0 0 170 112" role="img" aria-label="分割色紙"><rect x="5" y="5" width="160" height="102" rx="7" fill="#ffdc7a" stroke="#82522b" stroke-width="5"/>${cuts.map(x=>`<path d="M${x} 5V107" stroke="#82522b" stroke-width="4"/>`).join('')}</svg>`}
    function pizzaSvg(parts){let html=`<svg viewBox="0 0 180 180" role="img" aria-label="一個披薩平分成${parts}片，黃色是其中一片">`;for(let i=0;i<parts;i++){let a=-Math.PI/2+i*2*Math.PI/parts,b=-Math.PI/2+(i+1)*2*Math.PI/parts;html+=`<path d="M90 90L${90+78*Math.cos(a)} ${90+78*Math.sin(a)}A78 78 0 0 1 ${90+78*Math.cos(b)} ${90+78*Math.sin(b)}Z" fill="${i===0?'#ffe451':'#ff9f62'}" stroke="#8a4a2e" stroke-width="3"/>`}return html+'</svg>'}
    function fractionBar(parts){return `<div class="bar" style="grid-template-columns:repeat(${parts},1fr)">${Array.from({length:parts},()=>'<span></span>').join('')}</div>`}
    function shuffle(items){const out=[...items];for(let i=out.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
    function prompt(){if(state.stage===0)return {title:'找出真正平分的護盾！',copy:`這張色紙要平分成 ${PAPER[state.wave].n} 份。快點每份一樣大的那張！`,good:PAPER[state.wave].good,wrong:'看每一份的大小。只看切了幾刀，還不能確定有平分。'};if(state.stage===1){const n=PIZZA[state.wave];return {title:`快遞訂單：1/${n} 個披薩`,copy:`找出「1 個披薩平分成 ${n} 片，拿其中 1 片」的披薩。`,good:`完整的 1 個披薩平分成 ${n} 片，黃色 1 片就是 1/${n} 個。`,wrong:`先找完整的 1 個披薩，再數總共平分成幾片。`}}const [a,b]=PAIRS[state.wave];return {title:`魔王來了！1/${a} 和 1/${b} 誰大？`,copy:'兩條完整能量棒一樣長。點比較大的黃色一份，發射能量！',good:`同樣長的整條，分成 ${a} 份比分成 ${b} 份少，所以 1/${a} 比較大。`,wrong:'先確認整條一樣長，再看分成幾份。切越多，每份越小。'}}
    function choices(){let items;if(state.stage===0)items=PAPER[state.wave].choices.map((c,i)=>({key:i,ok:!!c.ok,html:`<span class="fraction">護盾 ${['A','B','C'][i]}</span>${paperSvg(c.cuts)}`}));else if(state.stage===1){let n=PIZZA[state.wave];items=[2,3,4].map(parts=>({key:parts,ok:parts===n,html:`${pizzaSvg(parts)}<span class="fraction">1/${parts} 個</span>`}))}else{let [a,b]=PAIRS[state.wave];items=[a,b].map(parts=>({key:parts,ok:parts===a,html:`<span class="fraction">1/${parts}</span><div class="bar-wrap">${fractionBar(parts)}</div><span class="whole">整條一樣長</span>`}))}return shuffle(items)}
    function drawHud(){el('hudStage').innerHTML=`<strong>${STAGES[state.stage].icon} ${STAGES[state.stage].name}</strong>　${state.wave+1}/3`;el('hearts').textContent='♥'.repeat(state.lives)+'♡'.repeat(3-state.lives);el('combo').textContent=state.streak;el('score').textContent=state.score;el('dragon').classList.toggle('hidden',state.stage!==2);el('station').classList.toggle('hidden',state.stage===2);el('station').textContent=state.stage===0?'✂️':'🍕';el('bossHp').classList.toggle('hidden',state.stage!==2);el('bossHearts').textContent='♥'.repeat(3-state.wave)+'♡'.repeat(state.wave);el('arenaLabel').textContent=state.stage===2?'能量龍準備攻擊！':STAGES[state.stage].intro;el('mission').textContent=`第 ${state.stage+1} 關・${STAGES[state.stage].name}`;el('waveCount').textContent=`第 ${state.wave+1} 波 / 3 波`;el('timerTrack').classList.toggle('hidden',state.practice);el('power').classList.toggle('hidden',state.stage===0||state.practice&&state.stage===1);el('power').textContent=state.stage===1?'⏱️ 暫停時間 5 秒':state.shieldArmed?'🛡️ 護盾已啟動':'🛡️ 啟動能量護盾';el('power').disabled=state.stage===1?state.power1Used:state.power2Used}
    function renderGame(){if(state.stage>=3){finish();return}if(state.rewardPending){reward();return}locked=false;freezeUntil=0;const p=prompt();drawHud();el('taskTitle').textContent=p.title;el('taskCopy').textContent=p.copy;el('status').textContent='';el('status').className='status';el('retry').classList.add('hidden');el('advance').classList.add('hidden');el('choices').classList.toggle('two',state.stage===2);el('choices').innerHTML=choices().map(item=>`<button type="button" class="target" data-key="${item.key}" data-ok="${item.ok}" aria-label="${item.key}：${state.stage===0?'這張色紙':state.stage===1?`1/${item.key} 個披薩`:`1/${item.key} 能量棒`}">${item.html}</button>`).join('');el('choices').querySelectorAll('.target').forEach(button=>button.addEventListener('click',()=>choose(button)));el('timerFill').style.width='100%';show('game');if(state.cleared){locked=true;el('choices').querySelectorAll('button').forEach(b=>b.disabled=true);el('status').textContent='✅ 這波能量已收集。準備好再按下一波！';el('status').classList.add('good');el('advance').classList.remove('hidden')}else startTimer()}
    function startTimer(){pause();if(state.practice)return;deadline=performance.now()+13000;lastTick=performance.now();timer=setInterval(()=>{const now=performance.now();if(now<freezeUntil){deadline+=now-lastTick;el('timerTrack').classList.add('paused')}else el('timerTrack').classList.remove('paused');lastTick=now;const left=Math.max(0,(deadline-now)/13000);el('timerFill').style.width=`${left*100}%`;if(left<=0)miss(null,true)},100)}
    function pause(){if(timer){clearInterval(timer);timer=null}}
    function choose(button){if(locked)return;const ok=button.dataset.ok==='true';button.classList.add(ok?'correct':'wrong');if(ok)hit();else miss(button,false)}
    function hit(){if(locked)return;locked=true;pause();const g=state.stage*3+state.wave;state.attempts[g]=(state.attempts[g]||0)+1;if(state.attempts[g]===1)state.first[g]=true;state.streak++;state.score+=(state.attempts[g]===1?100:60)+Math.min(state.streak,5)*10;state.cleared=true;save();drawHud();const p=prompt();el('status').textContent=`✅ 命中！${p.good}`;el('status').className='status good';el('advance').classList.remove('hidden');el('choices').querySelectorAll('button').forEach(b=>b.disabled=true);el('burst').textContent=state.streak>1?`${state.streak} 連擊！`:'命中！';el('arena').classList.remove('fire');void el('arena').offsetWidth;el('arena').classList.add('fire');tone('good')}
    function miss(button,timeout){if(locked)return;locked=true;pause();const g=state.stage*3+state.wave;state.attempts[g]=(state.attempts[g]||0)+1;if(state.attempts[g]===1)state.first[g]=false;state.streak=0;const blocked=state.stage===2&&state.shieldArmed;if(blocked)state.shieldArmed=false;else state.lives=Math.max(0,state.lives-1);save();drawHud();const p=prompt();el('status').textContent=`${timeout?'⏳ 時間到！':'🔎 再看一次！'}${blocked?' 能量護盾幫你擋住了。':''} ${p.wrong}${state.lives===0?' 護盾能量用完，按下方補充後再試。':''}`;el('status').className='status try';el('retry').textContent=state.lives===0?'補充護盾，再試！':'再試這一波';el('retry').classList.remove('hidden');el('choices').querySelectorAll('button').forEach(b=>b.disabled=true);el('arena').classList.remove('hit');void el('arena').offsetWidth;el('arena').classList.add('hit');tone('bad')}
    function retry(){if(state.lives===0)state.lives=3;save();renderGame()}
    function advance(){if(!state.cleared)return;state.cleared=false;if(state.wave===2){state.rewardPending=true;save();reward()}else{state.wave++;save();renderGame()}}
    function reward(){pause();const s=STAGES[state.stage];el('rewardIcon').textContent=s.icon;el('rewardTitle').textContent=`${s.name}突破！`;el('rewardSub').textContent=`你連續完成 3 波挑戰，能量城又亮了一塊！`;el('rewardPower').textContent=s.reward;el('rewardHow').textContent=s.how;el('rewardNext').textContent=state.stage===2?'領取通關秘技 ➜':'帶著道具打下一關 ➜';show('reward');tone('reward')}
    function nextStage(){state.stage++;state.wave=0;state.lives=3;state.streak=0;state.rewardPending=false;state.cleared=false;state.shieldArmed=false;save();if(state.stage>=3)finish();else renderGame()}
    function power(){if(state.stage===1&&!state.power1Used){state.power1Used=true;freezeUntil=performance.now()+5000;el('power').disabled=true;save();el('status').textContent='⏱️ 時間暫停器啟動！快看完整的披薩。';el('status').className='status good';tone('good')}else if(state.stage===2&&!state.power2Used){state.power2Used=true;state.shieldArmed=true;el('power').disabled=true;el('power').textContent='🛡️ 護盾已啟動';save();el('status').textContent='🛡️ 能量護盾啟動！這一回合可以擋掉一次失誤。';el('status').className='status good';tone('good')}}
    function finish(){pause();const count=state.first.filter(Boolean).length;el('record').innerHTML=STAGES.map((s,i)=>`<div>${s.icon} ${s.name}<strong>${[0,1,2].filter(w=>state.first[i*3+w]===true).length} / 3</strong>第一次命中</div>`).join('');el('recordNote').textContent=`第一次命中 ${count} / 9 波・總能量 ${state.score}。${state.practice?'這次使用無計時練習。':'這次使用限時冒險。'}紀錄只保存在這台裝置。`;show('finish');tone('reward')}
    function begin(){state.practice=el('practice').checked;save();if(state.stage>=3)finish();else if(state.rewardPending)reward();else renderGame()}
    load();home();el('sound').addEventListener('click',()=>{soundOn=!soundOn;el('sound').textContent=soundOn?'🔊 音效開':'🔇 音效關';el('sound').setAttribute('aria-pressed',String(soundOn));if(soundOn)tone('good')});el('bannerStart').addEventListener('click',begin);el('homeStart').addEventListener('click',begin);el('newGame').addEventListener('click',()=>{state=fresh();save();home()});el('back').addEventListener('click',home);el('retry').addEventListener('click',retry);el('advance').addEventListener('click',advance);el('rewardNext').addEventListener('click',nextStage);el('power').addEventListener('click',power);el('practice').addEventListener('change',()=>{state.practice=el('practice').checked;save()});el('print').addEventListener('click',()=>window.print());el('playAgain').addEventListener('click',()=>{state=fresh();save();home()});
  </script>
</body>
</html>
