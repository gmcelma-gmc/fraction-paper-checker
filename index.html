<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>平分小偵探</title>
  <style>
    :root {
      --ink: #18324a;
      --muted: #557086;
      --line: #cddbe7;
      --paper: #fffdfa;
      --sky: #e8f4ff;
      --leaf: #2f8068;
      --leaf-soft: #e8f6ef;
      --sun: #ffd36e;
      --sun-soft: #fff5d5;
      --coral: #d65a4a;
      --coral-soft: #fff0ed;
      --blue: #2369a1;
      --blue-soft: #eaf4ff;
      --shadow: 0 10px 26px rgba(36, 55, 75, .12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, #f2f8ff 0%, #edf7f0 100%);
      line-height: 1.55;
    }

    header {
      padding: 20px 18px 14px;
      background: linear-gradient(135deg, #fff7d8, #e4f5ff 55%, #eaf7ee);
      border-bottom: 1px solid var(--line);
    }

    .topbar {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 14px;
      align-items: center;
    }

    .mascot {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: white;
      border: 2px solid #b8d7eb;
      display: grid;
      place-items: center;
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 0;
    }

    header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 17px;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      grid-template-columns: minmax(320px, 400px) minmax(360px, 1fr);
      gap: 16px;
    }

    .panel {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    h2 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    .steps {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }

    .step {
      display: grid;
      grid-template-columns: 52px 1fr;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #d9e6ef;
      background: #f8fbfd;
    }

    .step-icon,
    .big-icon {
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: white;
      border: 2px solid #b8d7eb;
      color: var(--blue);
    }

    .step-icon {
      width: 52px;
      height: 52px;
    }

    .step-title {
      font-weight: 800;
      font-size: 17px;
    }

    .step-text {
      color: var(--muted);
      font-size: 14px;
    }

    label {
      display: block;
      font-weight: 800;
      margin: 14px 0 8px;
      font-size: 17px;
    }

    select,
    input[type="text"],
    input[type="number"] {
      width: 100%;
      border: 2px solid #b8cbdc;
      border-radius: 8px;
      padding: 12px;
      font: inherit;
      font-size: 18px;
      background: white;
      color: var(--ink);
    }

    .fraction-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .mode-note {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .file-picker {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 120px;
      border: 3px dashed #9cc3dd;
      border-radius: 8px;
      background: var(--blue-soft);
      text-align: center;
      padding: 14px;
      cursor: pointer;
    }

    .file-picker input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .file-title {
      font-size: 20px;
      font-weight: 900;
      color: var(--blue);
    }

    .file-text {
      color: var(--muted);
      font-size: 15px;
      margin-top: 4px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 13px 12px;
      min-height: 54px;
      font: inherit;
      font-weight: 900;
      font-size: 18px;
      cursor: pointer;
      color: white;
      background: var(--blue);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button.secondary {
      color: var(--ink);
      background: #edf4f9;
      border: 2px solid #c7d6e2;
    }

    button:disabled {
      opacity: .48;
      cursor: not-allowed;
    }

    .preview-wrap {
      width: 100%;
      min-height: 430px;
      background: #dfeaf2;
      border: 1px solid #c4d2de;
      border-radius: 8px;
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    canvas {
      max-width: 100%;
      max-height: 70vh;
      background: white;
      display: block;
    }

    .result {
      margin-top: 14px;
      border-radius: 8px;
      padding: 14px;
      border: 2px solid #b8d7eb;
      background: white;
      display: grid;
      grid-template-columns: 58px 1fr;
      gap: 12px;
      align-items: start;
    }

    .result.ready { border-color: #b8d7eb; background: #f8fcff; }
    .result.good { border-color: #7bc49a; background: var(--leaf-soft); }
    .result.try { border-color: #f0bd51; background: var(--sun-soft); }
    .result.fix { border-color: #eba095; background: var(--coral-soft); }

    .big-icon {
      width: 58px;
      height: 58px;
      background: white;
    }

    .result-title {
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .result-message {
      font-size: 18px;
    }

    .check-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .check-item {
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 8px;
      align-items: center;
      padding: 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, .7);
      border: 1px solid rgba(150, 175, 195, .42);
      font-size: 16px;
    }

    .small-note {
      color: var(--muted);
      font-size: 14px;
      margin-top: 10px;
    }

    svg {
      width: 30px;
      height: 30px;
      stroke: currentColor;
      stroke-width: 2.4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mascot svg {
      width: 46px;
      height: 46px;
      color: var(--leaf);
    }

    @media (max-width: 860px) {
      main { grid-template-columns: 1fr; padding: 12px; }
      h1 { font-size: 26px; }
      header p { font-size: 16px; }
      .preview-wrap { min-height: 300px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="mascot" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"></path><path d="M12 4v16"></path><path d="M8 8h.01"></path><path d="M16 8h.01"></path><path d="M8 15c2.2 1.5 5.8 1.5 8 0"></path></svg>
      </div>
      <div>
        <h1>平分小偵探</h1>
        <p>拍下你的色紙作品，看看是不是「每一份一樣大」。</p>
      </div>
    </div>
  </header>

  <main>
    <aside class="panel">
      <h2>跟著 3 步驟</h2>
      <div class="steps" aria-label="操作步驟">
        <div class="step">
          <div class="step-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"></path><path d="M12 4v16"></path></svg>
          </div>
          <div>
            <div class="step-title">1. 上傳照片</div>
            <div class="step-text">色紙要拍完整，線條要清楚。</div>
          </div>
        </div>
        <div class="step">
          <div class="step-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 7h3l2-2h6l2 2h3v12H4z"></path><circle cx="12" cy="13" r="3"></circle></svg>
          </div>
          <div>
            <div class="step-title">2. 開始檢查</div>
            <div class="step-text">我會先確認是不是等分。</div>
          </div>
        </div>
        <div class="step">
          <div class="step-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M9 11l2 2 4-5"></path><circle cx="12" cy="12" r="9"></circle></svg>
          </div>
          <div>
            <div class="step-title">3. 看回饋</div>
            <div class="step-text">等分成立後，再核對分數。</div>
          </div>
        </div>
      </div>

      <label for="studentName">我的座號或名字</label>
      <input id="studentName" type="text" placeholder="例：12號">

      <label for="targetFraction">我要檢查的分數</label>
      <select id="targetFraction">
        <option value="auto">讓平臺先判斷</option>
        <option value="2">1/2</option>
        <option value="4">1/4</option>
        <option value="8">1/8</option>
      </select>
      <div class="mode-note">先看色紙有沒有被平分，再判斷應該寫哪一個單位分數。</div>

      <label>我的作品照片</label>
      <div class="file-picker">
        <input id="imageInput" type="file" accept="image/*">
        <div>
          <div aria-hidden="true">
            <svg viewBox="0 0 24 24" style="width:42px;height:42px;color:var(--blue)"><path d="M4 7h3l2-2h6l2 2h3v12H4z"></path><circle cx="12" cy="13" r="3"></circle></svg>
          </div>
          <div class="file-title">點這裡選照片</div>
          <div id="fileText" class="file-text">請拍清楚一點喔</div>
        </div>
      </div>

      <div class="actions">
        <button id="analyzeBtn" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l2 2 4-5"></path><circle cx="12" cy="12" r="9"></circle></svg>
          開始檢查
        </button>
        <button id="resetBtn" class="secondary">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
          重選照片
        </button>
      </div>

    </aside>

    <section class="panel">
      <h2>我的作品</h2>
      <div class="preview-wrap">
        <canvas id="canvas" width="900" height="620"></canvas>
      </div>

      <div id="summary" class="result ready">
        <div class="big-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 7h3l2-2h6l2 2h3v12H4z"></path><circle cx="12" cy="13" r="3"></circle></svg>
        </div>
        <div>
          <div class="result-title">先上傳照片</div>
          <div class="result-message">我會幫你看看：有沒有平分？分數有沒有寫對？</div>
        </div>
      </div>

      <p class="small-note">小提醒：橫分、直分、斜分、十字分、條狀分、中心放射分都可能是對的；重點是每一份面積一樣大。</p>
    </section>
  </main>

  <script>
    const imageInput = document.getElementById('imageInput');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const resetBtn = document.getElementById('resetBtn');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const summary = document.getElementById('summary');
    const studentName = document.getElementById('studentName');
    const fileText = document.getElementById('fileText');
    const targetFraction = document.getElementById('targetFraction');
    let loadedImage = null;
    let imageLoadToken = 0;

    function iconSvg(type) {
      const icons = {
        ready: '<svg viewBox="0 0 24 24"><path d="M4 7h3l2-2h6l2 2h3v12H4z"></path><circle cx="12" cy="13" r="3"></circle></svg>',
        good: '<svg viewBox="0 0 24 24"><path d="M8 12l3 3 5-7"></path><circle cx="12" cy="12" r="9"></circle></svg>',
        try: '<svg viewBox="0 0 24 24"><path d="M12 3v4"></path><path d="M12 17v4"></path><path d="M4.9 4.9l2.8 2.8"></path><path d="M16.3 16.3l2.8 2.8"></path><circle cx="12" cy="12" r="4"></circle></svg>',
        fix: '<svg viewBox="0 0 24 24"><path d="M12 8v5"></path><path d="M12 17h.01"></path><path d="M10.3 3.9 2.8 17a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>'
      };
      return icons[type] || icons.ready;
    }

    function drawPlaceholder() {
      ctx.fillStyle = '#f8fbfd';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#466780';
      ctx.font = 'bold 30px Microsoft JhengHei';
      ctx.textAlign = 'center';
      ctx.fillText('請上傳你的作品照片', canvas.width / 2, canvas.height / 2);
    }

    drawPlaceholder();

    imageInput.addEventListener('change', event => {
      const file = event.target.files[0];
      if (!file) return;
      const currentToken = ++imageLoadToken;
      loadedImage = null;
      analyzeBtn.disabled = true;
      fileText.textContent = file.name;
      showResult('ready', '照片正在準備', '請等照片出現後，再按「開始檢查」。');
      ctx.fillStyle = '#f8fbfd';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#466780';
      ctx.font = 'bold 30px Microsoft JhengHei';
      ctx.textAlign = 'center';
      ctx.fillText('照片讀取中', canvas.width / 2, canvas.height / 2);
      const image = new Image();
      image.onload = () => {
        if (currentToken !== imageLoadToken) return;
        loadedImage = image;
        fitAndDrawImage();
        analyzeBtn.disabled = false;
        showResult('ready', '照片準備好了', '按「開始檢查」，看看你的每一份是不是一樣大。');
      };
      image.src = URL.createObjectURL(file);
    });

    resetBtn.addEventListener('click', () => {
      imageLoadToken++;
      imageInput.value = '';
      loadedImage = null;
      analyzeBtn.disabled = true;
      fileText.textContent = '請拍清楚一點喔';
      drawPlaceholder();
      showResult('ready', '先上傳照片', '我會幫你看看：有沒有平分？分數有沒有寫對？');
    });

    analyzeBtn.addEventListener('click', () => {
      if (!loadedImage) {
        showResult('ready', '照片還沒準備好', '請等照片出現後，再按「開始檢查」。');
        return;
      }
      renderResult(analyzeImage());
    });

    function fitAndDrawImage(overlays = null) {
      ctx.fillStyle = '#eef5fa';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const scale = Math.min(canvas.width / loadedImage.width, canvas.height / loadedImage.height);
      const width = loadedImage.width * scale;
      const height = loadedImage.height * scale;
      const x = (canvas.width - width) / 2;
      const y = (canvas.height - height) / 2;
      ctx.drawImage(loadedImage, x, y, width, height);
    }

    function analyzeImage() {
      fitAndDrawImage();
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      const bounds = detectPaperBounds(data, canvas.width, canvas.height);
      const selectedParts = targetFraction.value === 'auto' ? null : Number(targetFraction.value);
      let analysis;
      if (selectedParts) {
        const targetAnalysis = {
          ...findBestEqualDivision(data, canvas.width, canvas.height, bounds, selectedParts),
          expectedParts: selectedParts,
          actualParts: null,
          targetMode: true
        };
        const autoAnalysis = findBestDetectedDivision(data, canvas.width, canvas.height, bounds);
        analysis = targetAnalysis;
        if (autoAnalysis.isEqual && autoAnalysis.expectedParts !== selectedParts) {
          analysis = {
            ...autoAnalysis,
            expectedParts: selectedParts,
            actualParts: autoAnalysis.expectedParts,
            targetMode: true,
            isEqual: false,
            isClearlyEqual: false,
            isLikelyEqual: false,
            hasEnoughLines: true,
            autoReason: 'wrong-parts'
          };
        }
      } else {
        analysis = {
          ...findBestDetectedDivision(data, canvas.width, canvas.height, bounds),
          actualParts: null,
          targetMode: false
        };
      }
      fitAndDrawImage();
      return analysis;
    }

    function findBestDetectedDivision(data, width, height, bounds) {
      const analyses = [8, 4, 2].map(parts => ({
        ...findBestEqualDivision(data, width, height, bounds, parts),
        expectedParts: parts
      }));
      const centerLineCount = estimateCenterLineCount(data, width, height, bounds);
      const eighth = analyses.find(analysis => analysis.expectedParts === 8);
      if (centerLineCount >= 4 && !eighth.isEqual) {
        return {
          ...eighth,
          autoReason: 'center-lines-not-equal',
          hasEnoughLines: true,
          estimatedParts: 8,
          lineCount: Math.max(eighth.lineCount, centerLineCount)
        };
      }
      const equalAnalyses = analyses.filter(analysis => analysis.isEqual);
      if (equalAnalyses.length) {
        return equalAnalyses.sort((a, b) => b.expectedParts - a.expectedParts || b.score - a.score)[0];
      }
      return analyses.sort((a, b) => {
        if (a.hasEnoughLines !== b.hasEnoughLines) return b.hasEnoughLines - a.hasEnoughLines;
        if (a.lineCount !== b.lineCount) return b.lineCount - a.lineCount;
        return b.score - a.score;
      })[0];
    }

    function detectPaperBounds(data, width, height) {
      const yellowBounds = detectSpecificColorBounds(data, width, height, isYellowPaperPixel);
      if (yellowBounds) return yellowBounds;

      let minX = width, minY = height, maxX = 0, maxY = 0;
      let brightColorCount = 0;
      for (let y = 0; y < height; y += 3) {
        for (let x = 0; x < width; x += 3) {
          const i = (y * width + x) * 4;
          const r = data[i], g = data[i + 1], b = data[i + 2];
          const saturation = Math.max(r, g, b) - Math.min(r, g, b);
          const brightness = (r + g + b) / 3;
          if (brightness > 145 && brightness < 252 && saturation > 24) {
            minX = Math.min(minX, x);
            minY = Math.min(minY, y);
            maxX = Math.max(maxX, x);
            maxY = Math.max(maxY, y);
            brightColorCount++;
          }
        }
      }
      if (brightColorCount < 180 || maxX <= minX || maxY <= minY) {
        minX = width; minY = height; maxX = 0; maxY = 0;
        for (let y = 0; y < height; y += 3) {
          for (let x = 0; x < width; x += 3) {
            const i = (y * width + x) * 4;
            const r = data[i], g = data[i + 1], b = data[i + 2];
            const saturation = Math.max(r, g, b) - Math.min(r, g, b);
            const brightness = (r + g + b) / 3;
            if (brightness < 246 && brightness > 65 && saturation > 16) {
              minX = Math.min(minX, x);
              minY = Math.min(minY, y);
              maxX = Math.max(maxX, x);
              maxY = Math.max(maxY, y);
            }
          }
        }
      }
      if (maxX <= minX || maxY <= minY) return { x: 120, y: 90, w: 660, h: 440 };
      const pad = 16;
      return {
        x: Math.max(0, minX - pad),
        y: Math.max(0, minY - pad),
        w: Math.min(width - minX, maxX - minX + pad * 2),
        h: Math.min(height - minY, maxY - minY + pad * 2)
      };
    }

    function detectSpecificColorBounds(data, width, height, predicate) {
      let minX = width, minY = height, maxX = 0, maxY = 0, count = 0;
      for (let y = 0; y < height; y += 2) {
        for (let x = 0; x < width; x += 2) {
          const i = (y * width + x) * 4;
          if (predicate(data[i], data[i + 1], data[i + 2])) {
            minX = Math.min(minX, x);
            minY = Math.min(minY, y);
            maxX = Math.max(maxX, x);
            maxY = Math.max(maxY, y);
            count++;
          }
        }
      }
      if (count < 220 || maxX <= minX || maxY <= minY) return null;
      const pad = 12;
      return {
        x: Math.max(0, minX - pad),
        y: Math.max(0, minY - pad),
        w: Math.min(width - minX, maxX - minX + pad * 2),
        h: Math.min(height - minY, maxY - minY + pad * 2)
      };
    }

    function isYellowPaperPixel(r, g, b) {
      const brightness = (r + g + b) / 3;
      return r > 145 && g > 120 && b < 185 && brightness > 120 && r > b + 35 && g > b + 20;
    }

    function findBestEqualDivision(data, width, height, bounds, expectedParts) {
      const angles = [0, 15, 30, 45, 60, 75, 90, 105, 120, 135, 150, 165];
      const projections = angles.map(angle => detectLineProjection(data, width, height, bounds, angle));
      const stripCandidates = projections.map(projection => buildStripCandidate(data, width, height, bounds, projection, expectedParts));
      const vertical = projections.find(projection => projection.angle === 0);
      const horizontal = projections.find(projection => projection.angle === 90);
      const gridCandidate = buildGridCandidate(data, width, height, bounds, vertical, horizontal, expectedParts);
      const centerCrossCandidate = buildCenterCrossCandidate(data, width, height, bounds, expectedParts);
      const diagonalFourCandidate = buildDiagonalFourCandidate(data, width, height, bounds, projections, expectedParts);
      const radialEighthCandidate = buildRadialEighthCandidate(data, width, height, bounds, projections, expectedParts);
      const candidates = [radialEighthCandidate, diagonalFourCandidate, gridCandidate, centerCrossCandidate, ...stripCandidates]
        .filter(Boolean)
        .filter(candidate => isCandidateAllowedForParts(candidate, expectedParts));
      candidates.sort((a, b) => b.score - a.score);
      const best = candidates[0] || buildFailedCandidate(expectedParts);
      const clearThreshold = expectedParts === 8 ? 0.82 : 0.68;
      const likelyThreshold = expectedParts === 8 ? 0.82 : (expectedParts === 4 ? 0.68 : 0.50);
      const isClearlyEqual = best.hasEnoughLines && best.equalScore >= clearThreshold;
      const isLikelyEqual = best.hasEnoughLines && best.equalScore >= likelyThreshold;
      return { ...best, isEqual: isClearlyEqual || isLikelyEqual, isClearlyEqual, isLikelyEqual };
    }

    function isCandidateAllowedForParts(candidate, expectedParts) {
      if (expectedParts === 4) {
        if (candidate.pattern === 'grid') return candidate.equalScore >= 0.72 && candidate.lineCount === 2;
        if (candidate.pattern === 'diagonal4') return candidate.equalScore >= 0.74 && candidate.lineCount === 2;
        if (candidate.pattern === 'strip') return candidate.lineCount >= 3 && candidate.equalScore >= 0.82 && candidate.minLineStrength >= 0.035;
        return false;
      }
      if (expectedParts === 8) {
        if (candidate.pattern === 'radial8') return candidate.equalScore >= 0.76 && candidate.lineCount === 4;
        if (candidate.pattern === 'strip') return candidate.lineCount >= 7 && candidate.equalScore >= 0.86 && candidate.minLineStrength >= 0.035;
        return false;
      }
      return true;
    }

    function buildFailedCandidate(expectedParts) {
      return {
        pattern: 'none',
        score: 0,
        equalScore: 0,
        hasEnoughLines: false,
        estimatedParts: 1,
        lineCount: 0,
        lines: [],
        expectedParts
      };
    }

    function detectLineProjection(data, width, height, bounds, angle) {
      const radians = angle * Math.PI / 180;
      const nx = Math.cos(radians);
      const ny = Math.sin(radians);
      const corners = [
        [bounds.x, bounds.y],
        [bounds.x + bounds.w, bounds.y],
        [bounds.x, bounds.y + bounds.h],
        [bounds.x + bounds.w, bounds.y + bounds.h]
      ];
      const coords = corners.map(([x, y]) => x * nx + y * ny);
      const minCoord = Math.min(...coords);
      const maxCoord = Math.max(...coords);
      const binSize = 4;
      const binCount = Math.ceil((maxCoord - minCoord) / binSize) + 1;
      const darkBins = new Array(binCount).fill(0);
      const totalBins = new Array(binCount).fill(0);
      for (let y = bounds.y; y < bounds.y + bounds.h; y += 2) {
        for (let x = bounds.x; x < bounds.x + bounds.w; x += 2) {
          const roundedX = Math.max(0, Math.min(width - 1, Math.round(x)));
          const roundedY = Math.max(0, Math.min(height - 1, Math.round(y)));
          const i = (roundedY * width + roundedX) * 4;
          const brightness = (data[i] + data[i + 1] + data[i + 2]) / 3;
          const bin = Math.round(((x * nx + y * ny) - minCoord) / binSize);
          if (bin < 0 || bin >= binCount) continue;
          totalBins[bin]++;
          if (brightness < 145) darkBins[bin]++;
        }
      }
      const values = darkBins.map((dark, index) => dark / Math.max(1, totalBins[index]));
      const smoothed = values.map((_, index) => {
        let sum = 0, count = 0;
        for (let k = -1; k <= 1; k++) {
          if (values[index + k] !== undefined) {
            sum += values[index + k];
            count++;
          }
        }
        return sum / count;
      });
      const threshold = Math.max(0.035, Math.max(...smoothed) * 0.52);
      const peaks = [];
      let inPeak = false, peakStart = 0, peakMax = 0, peakIndex = 0;
      smoothed.forEach((value, index) => {
        if (value >= threshold && !inPeak) {
          inPeak = true;
          peakStart = index;
          peakMax = value;
          peakIndex = index;
        } else if (value >= threshold && inPeak) {
          if (value > peakMax) {
            peakMax = value;
            peakIndex = index;
          }
        } else if (value < threshold && inPeak) {
          if (index - peakStart > 2) peaks.push({ pos: minCoord + peakIndex * binSize, score: peakMax });
          inPeak = false;
        }
      });
      const maxPeaks = 9;
      const usable = peaks
        .filter(peak => peak.pos > minCoord + (maxCoord - minCoord) * .10 && peak.pos < minCoord + (maxCoord - minCoord) * .90)
        .sort((a, b) => b.score - a.score)
        .slice(0, maxPeaks)
        .sort((a, b) => a.pos - b.pos);
      const strengthByPosition = new Map(usable.map(peak => [Math.round(peak.pos), peak.score]));
      return { angle, minCoord, maxCoord, positions: usable.map(peak => peak.pos), strengthByPosition };
    }

    function buildStripCandidate(data, width, height, bounds, projection, expectedParts) {
      const needed = Math.max(1, expectedParts - 1);
      const positions = projection.positions
        .slice()
        .sort((a, b) => {
          const aStrength = projection.strengthByPosition.get(Math.round(a)) || 0;
          const bStrength = projection.strengthByPosition.get(Math.round(b)) || 0;
          return bStrength - aStrength;
        })
        .slice(0, needed)
        .sort((a, b) => a - b);
      const equalScore = estimateProjectionEqualScore(positions, projection.minCoord, projection.maxCoord, expectedParts);
      const hasEnoughLines = positions.length >= needed;
      const lineAngle = (projection.angle + 90) % 180;
      if (hasEnoughLines && hasUnexpectedCenterLine(data, width, height, bounds, [lineAngle])) return null;
      const lineStrength = positions.reduce((sum, position) => sum + (projection.strengthByPosition.get(Math.round(position)) || 0), 0);
      const minLineStrength = positions.reduce((min, position) => Math.min(min, projection.strengthByPosition.get(Math.round(position)) || 0), positions.length ? Infinity : 0);
      return {
        pattern: 'strip',
        score: (hasEnoughLines ? 0.45 : 0) + equalScore * 0.45 + Math.min(0.1, lineStrength * 0.7),
        equalScore,
        hasEnoughLines,
        minLineStrength,
        estimatedParts: hasEnoughLines ? expectedParts : positions.length + 1,
        lineCount: positions.length,
        lines: positions.map(position => lineSegmentForProjection(bounds, projection.angle, position))
      };
    }

    function estimateProjectionEqualScore(positions, minCoord, maxCoord, expectedParts) {
      if (positions.length < expectedParts - 1) return 0.3;
      const chosen = positions.slice(0, expectedParts - 1).sort((a, b) => a - b);
      const cuts = [minCoord, ...chosen, maxCoord];
      const parts = [];
      for (let index = 1; index < cuts.length; index++) parts.push(cuts[index] - cuts[index - 1]);
      const ideal = (maxCoord - minCoord) / expectedParts;
      const avgError = parts.reduce((sum, part) => sum + Math.abs(part - ideal) / ideal, 0) / parts.length;
      return Math.max(0, 1 - avgError);
    }

    function buildGridCandidate(data, width, height, bounds, vertical, horizontal, expectedParts) {
      if (expectedParts !== 4 || !vertical || !horizontal) return null;
      if (hasUnexpectedCenterLine(data, width, height, bounds, [0, 90])) return null;
      const verticalCenter = (vertical.minCoord + vertical.maxCoord) / 2;
      const horizontalCenter = (horizontal.minCoord + horizontal.maxCoord) / 2;
      const verticalLine = nearestPosition(vertical.positions, verticalCenter);
      const horizontalLine = nearestPosition(horizontal.positions, horizontalCenter);
      if (verticalLine === null || horizontalLine === null) return null;
      const verticalStrength = vertical.strengthByPosition.get(Math.round(verticalLine)) || 0;
      const horizontalStrength = horizontal.strengthByPosition.get(Math.round(horizontalLine)) || 0;
      if (verticalStrength < 0.035 || horizontalStrength < 0.035) return null;
      const verticalScore = 1 - Math.abs(verticalLine - verticalCenter) / ((vertical.maxCoord - vertical.minCoord) / 2);
      const horizontalScore = 1 - Math.abs(horizontalLine - horizontalCenter) / ((horizontal.maxCoord - horizontal.minCoord) / 2);
      const equalScore = Math.max(0, (verticalScore + horizontalScore) / 2);
      return {
        pattern: 'grid',
        score: 0.52 + equalScore * 0.46,
        equalScore,
        hasEnoughLines: true,
        estimatedParts: 4,
        lineCount: 2,
        lines: [
          lineSegmentForProjection(bounds, vertical.angle, verticalLine),
          lineSegmentForProjection(bounds, horizontal.angle, horizontalLine)
        ]
      };
    }

    function buildCenterCrossCandidate(data, width, height, bounds, expectedParts) {
      if (expectedParts !== 4) return null;
      const vertical = strongestCenterDarkLine(data, width, height, bounds, 'vertical');
      const horizontal = strongestCenterDarkLine(data, width, height, bounds, 'horizontal');
      if (!vertical || !horizontal) return null;
      if (hasUnexpectedCenterLine(data, width, height, bounds, [0, 90])) return null;
      const verticalCenter = bounds.x + bounds.w / 2;
      const horizontalCenter = bounds.y + bounds.h / 2;
      const verticalScore = 1 - Math.abs(vertical.position - verticalCenter) / (bounds.w * 0.34);
      const horizontalScore = 1 - Math.abs(horizontal.position - horizontalCenter) / (bounds.h * 0.34);
      if (Math.abs(vertical.position - verticalCenter) > bounds.w * 0.12) return null;
      if (Math.abs(horizontal.position - horizontalCenter) > bounds.h * 0.12) return null;
      const equalScore = Math.max(0, Math.min(1, (verticalScore + horizontalScore) / 2));
      const strengthScore = Math.min(1, (vertical.strength + horizontal.strength) * 3.2);
      if (vertical.strength < 0.04 || horizontal.strength < 0.04) return null;
      if (vertical.coverage < 0.67 || horizontal.coverage < 0.67) return null;
      if (equalScore < 0.30 || strengthScore < 0.08) return null;
      return {
        pattern: 'grid',
        score: 0.9 + equalScore * 0.12 + strengthScore * 0.08,
        equalScore: Math.max(equalScore, 0.72),
        hasEnoughLines: true,
        estimatedParts: 4,
        lineCount: 2,
        lines: [
          { x1: vertical.position, y1: bounds.y, x2: vertical.position, y2: bounds.y + bounds.h },
          { x1: bounds.x, y1: horizontal.position, x2: bounds.x + bounds.w, y2: horizontal.position }
        ]
      };
    }

    function buildDiagonalFourCandidate(data, width, height, bounds, projections, expectedParts) {
      if (expectedParts !== 4) return null;
      const targetAngles = [45, 135];
      const checked = targetAngles.map(angle => centerLineMatch(data, width, height, bounds, angle));
      if (checked.some(item => item.strength < 0.16)) return null;
      const equalScore = Math.min(1, checked.reduce((sum, item) => sum + item.strength, 0) / (targetAngles.length * 0.28));
      return {
        pattern: 'diagonal4',
        score: 1.02 + equalScore * 0.12,
        equalScore,
        hasEnoughLines: true,
        estimatedParts: 4,
        lineCount: 2,
        lines: checked.map(item => item.line)
      };
    }

    function buildRadialEighthCandidate(data, width, height, bounds, projections, expectedParts) {
      if (expectedParts !== 8) return null;
      const selected = [0, 45, 90, 135].map(targetAngle =>
        strongestCenterAngle(data, width, height, bounds, targetAngle, 6)
      );
      if (selected.length < 4) return null;
      if (selected.some(item => item.strength < 0.28)) return null;
      selected.sort((a, b) => a.angle - b.angle);
      const gaps = selected.map((item, index) => {
        const next = selected[(index + 1) % selected.length];
        return index === selected.length - 1 ? next.angle + 180 - item.angle : next.angle - item.angle;
      });
      const minGap = Math.min(...gaps);
      const maxGap = Math.max(...gaps);
      if (minGap < 34 || maxGap > 56) return null;
      const gapError = gaps.reduce((sum, gap) => sum + Math.abs(gap - 45) / 45, 0) / gaps.length;
      const angleScore = Math.max(0, 1 - gapError * 1.35);
      const strengthScore = Math.min(1, selected.reduce((sum, item) => sum + item.strength, 0) / (selected.length * 0.22));
      const equalScore = angleScore * 0.82 + strengthScore * 0.18;
      if (equalScore < 0.76) return null;
      return {
        pattern: 'radial8',
        score: 1.08 + equalScore * 0.12,
        equalScore,
        hasEnoughLines: true,
        estimatedParts: 8,
        lineCount: 4,
        lines: selected.map(item => item.line)
      };
    }

    function strongestCenterAngle(data, width, height, bounds, targetAngle, tolerance) {
      let best = null;
      for (let offset = -tolerance; offset <= tolerance; offset += 2) {
        let angle = targetAngle + offset;
        if (angle < 0) angle += 180;
        if (angle >= 180) angle -= 180;
        const line = lineSegmentThroughCenter(bounds, angle);
        const strength = lineDarkStrength(data, width, height, line);
        if (!best || strength > best.strength) best = { angle, line, strength };
      }
      return best;
    }

    function estimateCenterLineCount(data, width, height, bounds) {
      const angleChecks = [];
      for (let angle = 0; angle < 180; angle += 3) {
        const line = lineSegmentThroughCenter(bounds, angle);
        const strength = lineDarkStrength(data, width, height, line);
        angleChecks.push({ angle, strength });
      }
      const peaks = angleChecks
        .filter((item, index) => {
          const previous = angleChecks[(index - 1 + angleChecks.length) % angleChecks.length];
          const next = angleChecks[(index + 1) % angleChecks.length];
          return item.strength >= 0.16 && item.strength >= previous.strength && item.strength >= next.strength;
        })
        .sort((a, b) => b.strength - a.strength);
      const selected = [];
      for (const peak of peaks) {
        const tooClose = selected.some(item => {
          const diff = Math.abs(item.angle - peak.angle);
          return Math.min(diff, 180 - diff) < 12;
        });
        if (!tooClose) selected.push(peak);
      }
      return selected.length;
    }

    function centerLineMatch(data, width, height, bounds, lineAngle) {
      const line = lineSegmentThroughCenter(bounds, lineAngle);
      return { line, strength: lineDarkStrength(data, width, height, line) };
    }

    function hasUnexpectedCenterLine(data, width, height, bounds, allowedAngles) {
      const clearExtraThreshold = 0.30;
      return [0, 45, 90, 135].some(angle => {
        const isAllowed = allowedAngles.some(allowed => centerAngleDistance(angle, allowed) < 8);
        if (isAllowed) return false;
        const line = lineSegmentThroughCenter(bounds, angle);
        return lineDarkStrength(data, width, height, line) >= clearExtraThreshold;
      });
    }

    function centerAngleDistance(a, b) {
      const diff = Math.abs(a - b);
      return Math.min(diff, 180 - diff);
    }

    function lineSegmentThroughCenter(bounds, lineAngle) {
      const radians = lineAngle * Math.PI / 180;
      const dx = Math.cos(radians);
      const dy = Math.sin(radians);
      const cx = bounds.x + bounds.w / 2;
      const cy = bounds.y + bounds.h / 2;
      const candidates = [];
      if (Math.abs(dx) > 0.0001) {
        const tLeft = (bounds.x - cx) / dx;
        const yLeft = cy + tLeft * dy;
        if (yLeft >= bounds.y && yLeft <= bounds.y + bounds.h) candidates.push({ x: bounds.x, y: yLeft, t: tLeft });
        const tRight = (bounds.x + bounds.w - cx) / dx;
        const yRight = cy + tRight * dy;
        if (yRight >= bounds.y && yRight <= bounds.y + bounds.h) candidates.push({ x: bounds.x + bounds.w, y: yRight, t: tRight });
      }
      if (Math.abs(dy) > 0.0001) {
        const tTop = (bounds.y - cy) / dy;
        const xTop = cx + tTop * dx;
        if (xTop >= bounds.x && xTop <= bounds.x + bounds.w) candidates.push({ x: xTop, y: bounds.y, t: tTop });
        const tBottom = (bounds.y + bounds.h - cy) / dy;
        const xBottom = cx + tBottom * dx;
        if (xBottom >= bounds.x && xBottom <= bounds.x + bounds.w) candidates.push({ x: xBottom, y: bounds.y + bounds.h, t: tBottom });
      }
      candidates.sort((a, b) => a.t - b.t);
      const first = candidates[0] || { x: bounds.x, y: cy };
      const last = candidates[candidates.length - 1] || { x: bounds.x + bounds.w, y: cy };
      return { x1: first.x, y1: first.y, x2: last.x, y2: last.y };
    }

    function lineDarkStrength(data, width, height, line) {
      const length = Math.hypot(line.x2 - line.x1, line.y2 - line.y1);
      const dx = (line.x2 - line.x1) / Math.max(1, length);
      const dy = (line.y2 - line.y1) / Math.max(1, length);
      const normalX = -dy;
      const normalY = dx;
      let dark = 0;
      let total = 0;
      for (let step = 0; step <= length; step += 4) {
        const ratio = length ? step / length : 0;
        const baseX = line.x1 + (line.x2 - line.x1) * ratio;
        const baseY = line.y1 + (line.y2 - line.y1) * ratio;
        let localDark = false;
        for (let offset = -3; offset <= 3; offset++) {
          const x = Math.round(baseX + normalX * offset);
          const y = Math.round(baseY + normalY * offset);
          if (x < 0 || y < 0 || x >= width || y >= height) continue;
          const i = (y * width + x) * 4;
          if (isDarkLinePixel(data[i], data[i + 1], data[i + 2])) localDark = true;
        }
        if (localDark) dark++;
        total++;
      }
      return dark / Math.max(1, total);
    }

    function strongestLineNearCenter(data, width, height, bounds, angle) {
      const radians = angle * Math.PI / 180;
      const nx = Math.cos(radians);
      const ny = Math.sin(radians);
      const centerX = bounds.x + bounds.w / 2;
      const centerY = bounds.y + bounds.h / 2;
      const centerCoord = centerX * nx + centerY * ny;
      const searchRadius = Math.max(bounds.w, bounds.h) * 0.12;
      let best = null;
      for (let position = centerCoord - searchRadius; position <= centerCoord + searchRadius; position += 2) {
        const segment = lineSegmentForProjection(bounds, angle, position);
        const length = Math.hypot(segment.x2 - segment.x1, segment.y2 - segment.y1);
        let dark = 0;
        let total = 0;
        for (let step = 0; step <= length; step += 4) {
          const ratio = length ? step / length : 0;
          const baseX = segment.x1 + (segment.x2 - segment.x1) * ratio;
          const baseY = segment.y1 + (segment.y2 - segment.y1) * ratio;
          let localDark = false;
          for (let offset = -2; offset <= 2; offset++) {
            const x = Math.round(baseX + nx * offset);
            const y = Math.round(baseY + ny * offset);
            if (x < 0 || y < 0 || x >= width || y >= height) continue;
            const i = (y * width + x) * 4;
            const r = data[i], g = data[i + 1], b = data[i + 2];
            if (isDarkLinePixel(r, g, b)) localDark = true;
          }
          if (localDark) dark++;
          total++;
        }
        const strength = dark / Math.max(1, total);
        if (!best || strength > best.strength) best = { position, strength };
      }
      return best && best.strength > 0.01 ? best : null;
    }

    function projectionCoordinate(x, y, angle) {
      const radians = angle * Math.PI / 180;
      return x * Math.cos(radians) + y * Math.sin(radians);
    }

    function strongestCenterDarkLine(data, width, height, bounds, direction) {
      const isVertical = direction === 'vertical';
      const start = isVertical ? bounds.x : bounds.y;
      const length = isVertical ? bounds.w : bounds.h;
      const scanStart = start + length * 0.24;
      const scanEnd = start + length * 0.76;
      let best = null;
      for (let fixed = scanStart; fixed <= scanEnd; fixed += 1) {
        let dark = 0;
        let total = 0;
        const segmentHits = new Array(6).fill(0);
        const movingStart = isVertical ? bounds.y + bounds.h * 0.06 : bounds.x + bounds.w * 0.06;
        const movingEnd = isVertical ? bounds.y + bounds.h * 0.94 : bounds.x + bounds.w * 0.94;
        for (let moving = movingStart; moving <= movingEnd; moving += 3) {
          let localDark = false;
          for (let offset = -2; offset <= 2; offset++) {
            const x = Math.round(isVertical ? fixed + offset : moving);
            const y = Math.round(isVertical ? moving : fixed + offset);
            if (x < 0 || y < 0 || x >= width || y >= height) continue;
            const i = (y * width + x) * 4;
            const r = data[i], g = data[i + 1], b = data[i + 2];
            if (isDarkLinePixel(r, g, b)) localDark = true;
          }
          if (localDark) {
            dark++;
            const segmentIndex = Math.max(0, Math.min(segmentHits.length - 1, Math.floor(((moving - movingStart) / Math.max(1, movingEnd - movingStart)) * segmentHits.length)));
            segmentHits[segmentIndex]++;
          }
          total++;
        }
        const strength = dark / Math.max(1, total);
        const coverage = segmentHits.filter(hits => hits >= 2).length / segmentHits.length;
        const weightedStrength = strength * (0.45 + coverage * 0.55);
        if (!best || weightedStrength > best.weightedStrength) best = { position: fixed, strength, coverage, weightedStrength };
      }
      return best && best.strength > 0.025 && best.coverage >= 0.50 ? best : null;
    }

    function isDarkLinePixel(r, g, b) {
      const brightness = (r + g + b) / 3;
      const saturation = Math.max(r, g, b) - Math.min(r, g, b);
      return brightness < 150 || (brightness < 175 && saturation < 70);
    }

    function nearestPosition(positions, target) {
      if (!positions.length) return null;
      return positions.reduce((best, position) => Math.abs(position - target) < Math.abs(best - target) ? position : best, positions[0]);
    }

    function lineSegmentForProjection(bounds, angle, position) {
      const radians = angle * Math.PI / 180;
      const nx = Math.cos(radians);
      const ny = Math.sin(radians);
      const points = [];
      const left = bounds.x;
      const right = bounds.x + bounds.w;
      const top = bounds.y;
      const bottom = bounds.y + bounds.h;
      if (Math.abs(ny) > 0.0001) {
        const yAtLeft = (position - left * nx) / ny;
        const yAtRight = (position - right * nx) / ny;
        if (yAtLeft >= top && yAtLeft <= bottom) points.push({ x: left, y: yAtLeft });
        if (yAtRight >= top && yAtRight <= bottom) points.push({ x: right, y: yAtRight });
      }
      if (Math.abs(nx) > 0.0001) {
        const xAtTop = (position - top * ny) / nx;
        const xAtBottom = (position - bottom * ny) / nx;
        if (xAtTop >= left && xAtTop <= right) points.push({ x: xAtTop, y: top });
        if (xAtBottom >= left && xAtBottom <= right) points.push({ x: xAtBottom, y: bottom });
      }
      if (points.length < 2) return { x1: left, y1: top, x2: right, y2: bottom };
      return { x1: points[0].x, y1: points[0].y, x2: points[1].x, y2: points[1].y };
    }

    function showResult(kind, title, message, checks = []) {
      summary.className = `result ${kind}`;
      summary.innerHTML = `
        <div class="big-icon" aria-hidden="true">${iconSvg(kind)}</div>
        <div>
          <div class="result-title">${title}</div>
          <div class="result-message">${message}</div>
          ${checks.length ? `<div class="check-list">${checks.map(item => `<div class="check-item"><span>${item.icon}</span><span>${item.text}</span></div>`).join('')}</div>` : ''}
        </div>`;
    }

    function renderResult(analysis) {
      const name = studentName.value.trim() || '你';
      const expectedFraction = `1/${analysis.expectedParts}`;
      const actualFraction = analysis.actualParts ? `1/${analysis.actualParts}` : `1/${analysis.expectedParts}`;
      const modeText = analysis.targetMode ? `你選的是 ${expectedFraction}` : '平臺先自動判斷';
      const successChecks = [
        { icon: analysis.hasEnoughLines ? '✓' : '1', text: analysis.hasEnoughLines ? '我看得到你的分法。' : '請把分隔線畫清楚，讓我看得出每一份。' },
        { icon: analysis.isEqual ? '✓' : '2', text: analysis.isEqual ? '我先確認：每一份一樣大，才可以檢查分數。' : '請先修正等分：每一份要一樣大。' },
        { icon: '✓', text: `${modeText}；這張作品符合 ${analysis.expectedParts} 等分。` },
        { icon: '✓', text: `如果你要表示一份，正確的單位分數是 ${expectedFraction}。` }
      ];

      if (analysis.isEqual) {
        showResult(
          'good',
          `${name}，這樣可以！`,
          analysis.isClearlyEqual
            ? `我先確認這張作品有等分：每一份一樣大。這是 ${analysis.expectedParts} 等分，所以其中一份可以寫成 ${expectedFraction}。`
            : `我先確認這張作品接近等分。平分的方法可以很多種，但一定要每一份一樣大，才可以寫 ${expectedFraction}。`,
          successChecks
        );
      } else if (analysis.autoReason === 'wrong-parts') {
        showResult(
          'try',
          `${name}，分得很整齊，但分數要修正`,
          `我看到你的色紙比較像 ${analysis.actualParts} 等分。如果只取其中一份，應該寫 ${actualFraction}，不是 ${expectedFraction}。`,
          [
            { icon: '1', text: `請看全部被分成幾個一樣大的部分：我看到 ${analysis.actualParts} 份。` },
            { icon: '2', text: `如果要表示 ${expectedFraction}，請重新分成 ${analysis.expectedParts} 個一樣大的部分。` }
          ]
        );
      } else if (!analysis.hasEnoughLines) {
        showResult(
          'fix',
          `${name}，請先修正平分`,
          `平分的第一關鍵是：每一份一樣大。我沒有穩定看到清楚的分隔線，請先把分隔線畫清楚，再檢查每一份是不是一樣大。`,
          [
            { icon: '1', text: '請把分隔線畫清楚。' },
            { icon: '2', text: analysis.targetMode ? `要寫 ${expectedFraction}，要先分成 ${analysis.expectedParts} 個一樣大的部分。` : '請修正：每一份要一樣大。' }
          ]
        );
      } else {
        showResult(
          'try',
          `${name}，請修正平分`,
          analysis.autoReason === 'center-lines-not-equal'
            ? `我看到很多條分隔線，但每一份大小不一樣，所以還不能判定分數正確。分數成立的先決條件是「確實等分」。`
            : `還不能判定分數正確，因為分數成立的先決條件是「確實等分」。請重新摺一次或重新畫線，確認每一份能不能重疊。`,
          [
            { icon: '1', text: '請比一比：有沒有哪一份比較大、哪一份比較小？' },
            { icon: '2', text: analysis.targetMode ? `要表示 ${expectedFraction}，全部要先分成 ${analysis.expectedParts} 份，而且每份一樣大。` : '等分修正好以後，才能再檢查分數。' }
          ]
        );
      }
    }
  </script>
</body>
